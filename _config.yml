# Jekyll configuration for GitHub Pages (Just the Docs)
remote_theme: just-the-docs/just-the-docs@v0.10.1

title: vLLM CPU Performance Evaluation
description: Comprehensive performance evaluation framework for vLLM on CPU platforms
repository: redhat-et/vllm-cpu-perf-eval
baseurl: "/vllm-cpu-perf-eval"
url: "https://redhat-et.github.io"

# Build settings
destination: ./_site

# Just the Docs
color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub:
    - "https://github.com/redhat-et/vllm-cpu-perf-eval"
aux_links_new_tab: true

gh_edit_link: true
gh_edit_repository: "https://github.com/redhat-et/vllm-cpu-perf-eval"
gh_edit_branch: "main"

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

# File inclusions/exclusions
# IMPORTANT: Exclude Ansible YAML files to prevent Jekyll from parsing Jinja2 templates
include: []

exclude:
  - README.md
  - .gitignore
  - .pre-commit-config.yaml
  - .yamllint.yaml
  - .markdownlint-cli2.yaml
  - .github-pages
  - vendor
  - automation
  - results
  - utils
  - hack
  - venv
  - PR_SUMMARY.md
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - image.tar
  - docs/design/full-testing-deck.md
  - _data/nav_sections.yml

sass:
  sass_dir: _sass
  style: compressed
