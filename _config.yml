# Jekyll configuration for GitHub Pages
# Use remote_theme for GitHub Pages compatibility
remote_theme: pages-themes/cayman@v0.2.0
title: vLLM CPU Performance Evaluation
description: Comprehensive performance evaluation framework for vLLM on CPU platforms
repository: redhat-et/vllm-cpu-perf-eval
baseurl: "/vllm-cpu-perf-eval"
url: "https://redhat-et.github.io"

# Build settings
destination: ./_site

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-seo-tag

# Relative links configuration
relative_links:
  enabled: true
  collections: false

# Titles from headings
titles_from_headings:
  enabled: true
  strip_title: false
  collections: false

# File inclusions/exclusions
# IMPORTANT: Exclude Ansible YAML files to prevent Jekyll from parsing Jinja2 templates
include:
  - README.md

exclude:
  - .gitignore
  - .pre-commit-config.yaml
  - .yamllint.yaml
  - .markdownlint-cli2.yaml
  - .github-pages
  - vendor
  - automation  # Exclude entire automation directory (contains Jinja2 templates)
  - results
  - utils
  - hack
  - venv
  - PR_SUMMARY.md
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - image.tar  # Exclude container image to prevent podman permission issues
  # Marp slide sources (rendered separately; Jekyll would mangle Marp front matter)
  - docs/design/full-testing-deck.md
