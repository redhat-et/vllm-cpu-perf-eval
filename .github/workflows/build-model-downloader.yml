name: Build and Push Model Downloader Container

on:
  push:
    branches:
      - main
      - container/**
    paths:
      - "container-images/model-downloader/**"
      - ".github/workflows/build-model-downloader.yml"
  pull_request:
    paths:
      - "container-images/model-downloader/**"
      - ".github/workflows/build-model-downloader.yml"
  workflow_dispatch:  # Allow manual trigger

env:
  IMAGE_REGISTRY: quay.io
  IMAGE_REPOSITORY: vllm-cpu-perf-eval/model-downloader
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/container/'))
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=${{ env.IMAGE_TAG }}-{{sha}}
            type=raw,value=${{ env.IMAGE_TAG }}-{{date 'YYYYMMDD'}}

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: ./container-images/model-downloader
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test container image
        run: |
          docker run --rm ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            /usr/local/bin/download_model.py --help

      - name: Push container image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/container/'))
        uses: docker/build-push-action@v7
        with:
          context: ./container-images/model-downloader
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Display image info
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/container/'))
        run: |
          echo "✅ Container image pushed successfully!"
          echo ""
          echo "Image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          echo ""
          echo "Additional tags:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  - /'
