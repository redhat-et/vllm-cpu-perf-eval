name: cpueval CLI Tests

"on":
  push:
    branches: [main]
    paths:
      - "automation/cli/**"
      - "cpueval"
      - ".github/workflows/cpueval-tests.yml"
  pull_request:
    paths:
      - "automation/cli/**"
      - "cpueval"
      - ".github/workflows/cpueval-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: automation/cli
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        working-directory: automation/cli
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Test CLI imports
        working-directory: automation/cli
        run: |
          python -c "from cpueval.cli import app; print('✓ CLI imports successfully')"
          python -c "from cpueval.results import extract_metrics; print('✓ Results imports successfully')"
          python -c "from cpueval.runners import merge_extra_vars; print('✓ Runners imports successfully')"

      - name: Test CLI help output
        run: |
          cd automation/cli
          python -m cpueval --help
          python -m cpueval list --help
          python -m cpueval run --help
          python -m cpueval results --help

      - name: Smoke-test implicit run and backward compat
        run: |
          cd automation/cli
          python -m cpueval --suite rhaiis-sweep --dry-run
          python -m cpueval run --suite rhaiis-sweep --dry-run

  container-smoke:
    name: CLI container (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubi9
            image: registry.access.redhat.com/ubi9/ubi:latest
          - name: fedora
            image: fedora:latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Smoke launcher and install in ${{ matrix.name }}
        run: |
          docker run --rm \
            --user 0 \
            -e HOME=/tmp/cpueval-home \
            -v "$PWD:/src" \
            -w /src \
            "${{ matrix.image }}" \
            bash /src/automation/cli/tests/container-smoke.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: |
          # Check for syntax errors and undefined names
          ruff check automation/cli/src/ --select=E9,F63,F7,F82 --statistics

          # Check for common issues (allow line length up to 100)
          ruff check automation/cli/src/ --line-length=100 --ignore=E501 || true
