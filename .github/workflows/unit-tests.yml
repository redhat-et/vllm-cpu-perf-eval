---
name: Tests
permissions:
  contents: read

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ansible pyyaml streamlit plotly pandas

      - name: Run Ansible unit tests
        run: |
          cd automation/test-execution/ansible/tests
          python -m pytest unit/ -v -m unit

      - name: Run backend abstraction tests
        run: |
          cd automation/test-execution
          python -m pytest shared/backends/tests/ -v

      - name: Run load generator abstraction tests
        run: |
          cd automation/test-execution
          python -m pytest shared/loadgens/tests/ -v

      - name: Run dashboard tests
        run: |
          cd automation/test-execution/tests/dashboard
          python -m pytest test_offline_batch_page.py -v
          cd ../../dashboard-examples/vllm_dashboard
          python -m pytest tests/test_lm_eval_loader.py -v

      - name: Run script tests
        run: |
          cd automation/test-execution/tests/scripts
          bash test_run_offline_batch_suite.sh
          bash test_run_lm_eval_suite.sh

      - name: Test results summary
        if: always()
        run: |
          echo "Unit test execution completed"

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ansible pyyaml

      - name: Run smoke tests
        run: |
          cd automation/test-execution/ansible/tests
          python -m pytest smoke/ -v -m smoke

      - name: Test results summary
        if: always()
        run: |
          echo "Smoke test execution completed"
