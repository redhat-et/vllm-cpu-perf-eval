---
# ============================================================================
# Audio Model Benchmarking with GuideLLM
# ============================================================================
# Comprehensive audio benchmarking for ASR (transcription), translation, and
# audio chat tasks with CPU-optimized vLLM configuration
#
# ⚠️  IMPORTANT: vLLM v0.25.1 V1 engine has CPU encoder-decoder bugs.
#     Workaround (Recommended): Disable V1 engine on v0.25.1
#       Add to vllm_env_vars in your playbook:
#         VLLM_USE_V2_MODEL_RUNNER: "0"
#     Alternative: Use v0.20.0 (works but older)
#       export VLLM_CONTAINER_IMAGE=docker.io/vllm/vllm-openai-cpu:v0.20.0
#
# TODO: Once vLLM fixes CPU encoder-decoder support in V1 engine, remove workaround
#       Tracking: https://github.com/vllm-project/vllm/issues/XXXXX (add issue # when created)
#       Test whisper-tiny works before removing this notice
#
# Modes:
#   - managed: Starts vLLM server with specified CPU configuration
#   - external: Tests against existing vLLM endpoint
#
# Usage Examples:
#
#   # Managed mode with auto CPU configuration (v0.25.1 with V2 runner workaround)
#   # Note: With 32 cores, auto-calculates: TP=1, OMP=30 (reserves 2 for control plane)
#   ansible-playbook audio-benchmark.yml \
#     -e "test_model=openai/whisper-small" \
#     -e "test_scenario=transcription-throughput" \
#     -e "requested_cores=32" \
#     -e '{"vllm_env_vars": {"VLLM_USE_V2_MODEL_RUNNER": "0"}}'
#
#   # External endpoint mode
#   ansible-playbook audio-benchmark.yml \
#     -e "test_scenario=transcription-latency" \
#     -e vllm_endpoint.mode=external \
#     -e vllm_endpoint.external.url=http://remote-host:8000
#
#   # Advanced CPU configuration
#   # With 64 cores: auto-calculates TP=2, OMP=31 (reserves 2 for control plane)
#   ansible-playbook audio-benchmark.yml \
#     -e "test_model=openai/whisper-medium" \
#     -e "test_scenario=audio-duration-scaling" \
#     -e "requested_cores=64" \
#     -e "vllm_dtype=bfloat16"
#
#   # Manual override (if you want different control plane reservation)
#   ansible-playbook audio-benchmark.yml \
#     -e "test_model=openai/whisper-small" \
#     -e "test_scenario=transcription-throughput" \
#     -e "requested_cores=32" \
#     -e "requested_tensor_parallel=1" \
#     -e "omp_num_threads=28"  # Manually set (reserves 4 for control plane)
#
#   # Override number of audio files to process
#   ansible-playbook audio-benchmark.yml \
#     -e "test_model=openai/whisper-tiny" \
#     -e "test_scenario=transcription-throughput" \
#     -e "requested_cores=32" \
#     -e "audio_num_files=10"  # Process only 10 files per stage
#
#   # Note: Throughput stage concurrency defaults to 50 concurrent streams
#   # Edit scenario YAML to change rate per stage if needed for load balancer setups
#
# Test Scenarios:
#   - transcription-throughput: How long to transcribe N files
#   - transcription-latency: Latency under different loads
#   - audio-duration-scaling: Performance vs audio length
#   - constant-rate-stress: Sustained load stability
#   - format-comparison: Audio format performance
#
# ============================================================================

- name: "Audio Benchmark - Setup and Validation"
  hosts: localhost
  gather_facts: false

  vars:
    # vLLM mode: managed (start server) or external (use existing endpoint)
    vllm_mode: "{{ vllm_endpoint.mode | default('managed') }}"

    # Audio-specific vLLM defaults (can be overridden via -e)
    default_vllm_dtype: "auto"  # Let vLLM choose optimal dtype for model
    default_vllm_max_model_len: 448  # Whisper default
    default_vllm_kvcache_space: "2GiB"

    # Effective values (use provided or default)
    effective_vllm_dtype: "{{ vllm_dtype | default(default_vllm_dtype) }}"
    effective_vllm_max_model_len: "{{ vllm_max_model_len | default(default_vllm_max_model_len) }}"
    effective_vllm_kvcache_space: "{{ vllm_kvcache_space | default(default_vllm_kvcache_space) }}"

    # CPU configuration defaults
    # Reserve 2 cores for vLLM control plane (scheduler, KV cache manager, async operations)
    # Formula: OMP threads = (requested_cores - 2) / tensor_parallel
    vllm_control_plane_cores: 2
    default_omp_num_threads: "{{ ((requested_cores | int - vllm_control_plane_cores) / (requested_tensor_parallel | default(1) | int)) | int if requested_cores is defined else omit }}"

  tasks:
    - name: Detect if running from AWX
      ansible.builtin.set_fact:
        is_awx_job: "{{ lookup('env', 'AWX_JOB_ID') | length > 0 }}"
        local_results_base: "{{ lookup('env', 'HOME') ~ '/benchmark-results' if (lookup('env', 'AWX_JOB_ID') | length > 0) else playbook_dir ~ '/../../../results' }}"

    # ========================================================================
    # Input Validation
    # ========================================================================

    - name: Validate required parameters (managed mode)
      ansible.builtin.assert:
        that:
          - test_model is defined
          - test_model != '__AUTO_DETECT__'
          - test_scenario is defined
          - requested_cores is defined
          - requested_cores | int > 0
        fail_msg: |
          Missing required variables for managed mode. Please provide:
          -e "test_model=<openai/whisper-small|openai/whisper-medium|...>"
          -e "test_scenario=<transcription-throughput|transcription-latency|...>"
          -e "requested_cores=<8|16|32|64|...>"

          Optional:
          -e "requested_tensor_parallel=<1|2|4>"  # Auto-calculated if omitted
          -e "omp_num_threads=<N>"                # Auto-calculated if omitted
          -e "vllm_dtype=<auto|float16|bfloat16>" # Default: auto (vLLM chooses)
          -e "vllm_max_model_len=<448>"           # Default: 448 (Whisper)
          -e "vllm_kvcache_space=<2GiB>"          # Default: 2GiB
      when: vllm_mode == 'managed'

    - name: Validate required parameters (external mode)
      ansible.builtin.assert:
        that:
          - test_scenario is defined
          - vllm_endpoint.external.url is defined
        fail_msg: |
          Missing required variables for external mode. Please provide:
          -e "test_scenario=<transcription-throughput|transcription-latency|...>"
          -e vllm_endpoint.external.url=http://your-vllm-host:8000

          Optional:
          -e "test_model=<model>"  # Will be auto-detected if omitted
      when: vllm_mode == 'external'

    - name: Validate test scenario is supported
      ansible.builtin.assert:
        that:
          - test_scenario in ['transcription-throughput', 'transcription-latency', 'audio-duration-scaling', 'constant-rate-stress', 'format-comparison', 'transcription-quality', 'quick-test']
        fail_msg: |
          Unsupported test_scenario: {{ test_scenario }}
          Supported scenarios:
            - transcription-throughput (main: N files transcription time)
            - transcription-latency (latency under load)
            - audio-duration-scaling (performance vs audio length)
            - constant-rate-stress (sustained load stability)
            - format-comparison (audio format comparison)
            - transcription-quality (WER/CER accuracy evaluation)
            - quick-test (fast 5-file test for validation)

    - name: Validate audio_num_files if provided
      ansible.builtin.assert:
        that:
          - audio_num_files | int > 0
          - audio_num_files | int <= 10000
        fail_msg: "audio_num_files must be between 1 and 10000, got: {{ audio_num_files }}"
      when: audio_num_files is defined

    # ========================================================================
    # Test Scenario Configuration Loading
    # ========================================================================

    - name: Load test scenario configuration
      ansible.builtin.include_vars:
        file: "../../../tests/audio-models/{{ test_scenario }}.yaml"
        name: scenario_config

    - name: Extract scenario details
      ansible.builtin.set_fact:
        scenario_name: "{{ scenario_config.test_scenario.name }}"
        scenario_type: "{{ scenario_config.test_scenario.type }}"
        scenario_description: "{{ scenario_config.test_scenario.description }}"
        scenario_backend: "{{ scenario_config.test_scenario.backend }}"
        scenario_endpoint: "{{ scenario_config.test_scenario.endpoint }}"
        scenario_request_type: "{{ scenario_config.test_scenario.request_type }}"
        scenario_dataset: "{{ scenario_config.test_scenario.dataset }}"
        scenario_stages: "{{ scenario_config.test_scenario.stages }}"

    - name: Override max_requests in all stages if audio_num_files is provided
      ansible.builtin.set_fact:
        scenario_stages: >-
          {{
            scenario_stages | map('combine', {'max_requests': audio_num_files | int}) | list
          }}
      when: audio_num_files is defined

    # ========================================================================
    # CPU Configuration
    # ========================================================================

    - name: Set CPU configuration for managed mode
      when: vllm_mode == 'managed'
      block:
        - name: Auto-calculate tensor parallel if not specified (audio models favor TP=1 or TP=2)
          ansible.builtin.set_fact:
            # For audio models (especially Whisper), prefer TP=1 or TP=2
            # Only use higher TP for very large models (>1B params)
            # TP=2 for 64+ cores, TP=1 otherwise
            requested_tensor_parallel: "{{ 2 if (requested_cores | int >= 64) else 1 }}"
          when: requested_tensor_parallel is not defined

        - name: Auto-calculate OMP threads if not specified
          ansible.builtin.set_fact:
            omp_num_threads: "{{ default_omp_num_threads }}"
          when: omp_num_threads is not defined

        - name: Display CPU configuration
          ansible.builtin.debug:
            msg:
              - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              - "CPU Configuration (Managed Mode)"
              - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              - "Container Cores: {{ requested_cores }} (cores 0-{{ (requested_cores | int) - 1 }})"
              - "Control Plane Reserve: {{ vllm_control_plane_cores }} cores (VLLM_CPU_NUM_OF_RESERVED_CPU={{ vllm_control_plane_cores }})"
              - "Tensor Parallel: {{ requested_tensor_parallel }}"
              - "{% if requested_tensor_parallel | int > 1 %}Worker Threads (OMP): {{ omp_num_threads }}{% else %}Worker Threads: Auto (TP=1, no OMP override){% endif %}"
              - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              - "vLLM Configuration:"
              - "  Data Type: {{ effective_vllm_dtype }}"
              - "  Max Model Length: {{ effective_vllm_max_model_len }}"
              - "  KV Cache Space: {{ effective_vllm_kvcache_space }}"
              - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    - name: Override cores to 0 for external mode
      ansible.builtin.set_fact:
        requested_cores: 0
      when: vllm_mode == 'external'

    # ========================================================================
    # Model Detection/Validation
    # ========================================================================

    - name: Handle external endpoint model detection
      when: vllm_mode == 'external'
      block:
        - name: Get model from external endpoint
          ansible.builtin.uri:
            url: "{{ vllm_endpoint.external.url }}/v1/models"
            method: GET
            status_code: 200
            validate_certs: false
          register: external_models_response
          delegate_to: localhost

        - name: Extract model name from endpoint
          ansible.builtin.set_fact:
            endpoint_model: "{{ external_models_response.json.data[0].id }}"

        - name: Use endpoint model if not specified
          ansible.builtin.set_fact:
            test_model: "{{ endpoint_model }}"
            actual_model: "{{ endpoint_model }}"
            cacheable: true
          when: test_model is not defined or test_model == '__AUTO_DETECT__'

        - name: Set actual_model if test_model was provided
          ansible.builtin.set_fact:
            actual_model: "{{ test_model }}"
            cacheable: true
          when: test_model is defined and test_model != '__AUTO_DETECT__'

        - name: Display detected model
          ansible.builtin.debug:
            msg: "Detected model from external endpoint: {{ actual_model }}"

    # ========================================================================
    # Generate Test Run ID
    # ========================================================================

    - name: Generate test run ID if not provided
      ansible.builtin.set_fact:
        test_run_id: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
        cacheable: true
      when: test_run_id is not defined

    - name: Set actual_model (managed mode)
      ansible.builtin.set_fact:
        actual_model: "{{ test_model }}"
        cacheable: true
      when: vllm_mode == 'managed'

    - name: Cache effective vLLM settings for next plays
      ansible.builtin.set_fact:
        effective_vllm_dtype: "{{ vllm_dtype | default(default_vllm_dtype) }}"
        effective_vllm_max_model_len: "{{ vllm_max_model_len | default(default_vllm_max_model_len) }}"
        effective_vllm_kvcache_space: "{{ vllm_kvcache_space | default(default_vllm_kvcache_space) }}"
        effective_omp_num_threads: "{{ omp_num_threads | default(default_omp_num_threads) }}"
        effective_requested_tensor_parallel: "{{ requested_tensor_parallel | default(1) }}"
        cacheable: true

    # ========================================================================
    # Display Configuration Summary
    # ========================================================================

    - name: Display audio benchmark configuration
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════════════════════════╗"
          - "║           Audio Model Benchmarking with GuideLLM            ║"
          - "╠══════════════════════════════════════════════════════════════╣"
          - "  vLLM Mode: {{ vllm_mode }}"
          - "  Model: {{ actual_model }}"
          - "  Test Scenario: {{ scenario_name }}"
          - "  Description: {{ scenario_description }}"
          - "  Test Run ID: {{ test_run_id }}"
          - "  "
          - "  Dataset: {{ scenario_dataset.name }}"
          - "  Request Type: {{ scenario_request_type }}"
          - "  Endpoint: {{ scenario_endpoint }}"
          - "  Stages: {{ scenario_stages | length }}"
          - "  {% if audio_num_files is defined %}Audio Files per Stage: {{ audio_num_files }}{% endif %}"
          - "╚══════════════════════════════════════════════════════════════╝"

# ============================================================================
# Start vLLM Server (Managed Mode Only)
# ============================================================================

- name: "Start vLLM Audio Server"
  hosts: dut
  become: "{{ ansible_become | default(true) | bool }}"
  vars:
    vllm_mode: "{{ vllm_endpoint.mode | default('managed') }}"
    # Pull variables from localhost facts
    test_run_id: "{{ hostvars['localhost']['test_run_id'] }}"
    test_model: "{{ hostvars['localhost']['test_model'] }}"
    actual_model: "{{ hostvars['localhost']['actual_model'] }}"
    requested_cores: "{{ hostvars['localhost']['requested_cores'] | default(0) }}"
    effective_vllm_dtype: "{{ hostvars['localhost']['effective_vllm_dtype'] }}"
    effective_vllm_max_model_len: "{{ hostvars['localhost']['effective_vllm_max_model_len'] }}"
    effective_vllm_kvcache_space: "{{ hostvars['localhost']['effective_vllm_kvcache_space'] }}"
    effective_omp_num_threads: "{{ hostvars['localhost']['effective_omp_num_threads'] }}"
    effective_requested_tensor_parallel: "{{ hostvars['localhost']['effective_requested_tensor_parallel'] }}"
    vllm_control_plane_cores: 2  # Reserve 2 cores for control plane (defined here for vllm-server play)
    container_name: "vllm-audio-{{ hostvars['localhost']['test_run_id'] }}"

  tasks:
    - name: Detect DUT platform (managed mode)
      when: vllm_mode == 'managed'
      block:
        - name: Get CPU model name for platform identification
          ansible.builtin.shell: |
            lscpu | grep -i '^Model name' | sed 's/^[Mm]odel name:[[:space:]]*//' | head -1
          register: cpu_model_raw
          changed_when: false

        - name: Save sanitized platform name to localhost
          ansible.builtin.set_fact:
            dut_platform_name: "{{ cpu_model_raw.stdout | trim | regex_replace('[^a-zA-Z0-9]', '_') | regex_replace('_+', '_') | regex_replace('^_|_$', '') }}"
          delegate_to: localhost
          delegate_facts: true

        - name: Display detected platform
          ansible.builtin.debug:
            msg: "Platform detected: {{ cpu_model_raw.stdout | trim }}"

    - name: Detect vLLM version from endpoint
      when: vllm_mode == 'external'
      block:
        - name: Query vLLM version from external endpoint
          ansible.builtin.uri:
            url: "{{ vllm_endpoint.external.url }}/version"
            method: GET
            status_code: [200]
            validate_certs: false
          register: vllm_version_response
          failed_when: false
          delegate_to: localhost

        - name: Save vLLM version to localhost
          ansible.builtin.set_fact:
            vllm_version: "{{ vllm_version_response.json.version | default('unknown') }}"
          delegate_to: localhost
          delegate_facts: true
          when: vllm_version_response.status | default(0) == 200

    - name: Start vLLM server (managed mode only)
      when: vllm_mode == 'managed'
      block:
        - name: Create required directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0777"  # World-writable for container compatibility
          loop:
            - "{{ model_cache_dir }}"
            - "{{ log_dir }}"

        - name: Build vLLM image with audio support
          block:
            - name: Pull base vLLM image
              containers.podman.podman_image:
                name: "{{ container_runtime.image }}"
                state: present

            - name: Check if vLLM audio image already exists
              ansible.builtin.command:
                cmd: "podman images -q localhost/vllm-audio-cpu:{{ container_runtime.image.split(':')[1] }}"
              register: audio_image_check
              changed_when: false
              failed_when: false

            - name: Build vLLM audio image (if not exists)
              when: audio_image_check.stdout == ""
              block:
                - name: Create Containerfile for audio support
                  ansible.builtin.copy:
                    dest: "{{ log_dir }}/Containerfile.audio"
                    content: |
                      FROM {{ container_runtime.image }}
                      # Install audio dependencies (librosa, soundfile, ffmpeg-python)
                      # Note: vLLM base images don't include audio extras
                      RUN uv pip install --no-cache-dir librosa soundfile ffmpeg-python
                    mode: "0644"

                - name: Build vLLM image with audio dependencies
                  ansible.builtin.command:
                    cmd: >
                      podman build
                      -f {{ log_dir }}/Containerfile.audio
                      -t localhost/vllm-audio-cpu:{{ container_runtime.image.split(':')[1] }}
                      {{ log_dir }}
                  register: image_build
                  changed_when: true

                - name: Verify audio dependencies in built image
                  ansible.builtin.command:
                    cmd: >
                      podman run --rm --entrypoint python3
                      localhost/vllm-audio-cpu:{{ container_runtime.image.split(':')[1] }}
                      -c 'import librosa; import soundfile; print("✓ Audio deps verified")'
                  register: verify_audio
                  changed_when: false

                - name: Display verification
                  ansible.builtin.debug:
                    msg: "{{ verify_audio.stdout }}"

                - name: Remove Containerfile
                  ansible.builtin.file:
                    path: "{{ log_dir }}/Containerfile.audio"
                    state: absent

            - name: Set audio-enabled image name
              ansible.builtin.set_fact:
                vllm_audio_image: "localhost/vllm-audio-cpu:{{ container_runtime.image.split(':')[1] }}"

        - name: Stop and remove any previous audio vLLM container
          containers.podman.podman_container:
            name: "{{ container_name }}"
            state: absent
          ignore_errors: true

        - name: Determine NUMA node from core range
          ansible.builtin.set_fact:
            numa_node: "0"  # Default to node 0, can be enhanced with auto-detection

        - name: Build vLLM command arguments
          ansible.builtin.set_fact:
            vllm_command: >-
              --model {{ test_model }}
              --host {{ vllm_server.host }}
              --port {{ vllm_server.port }}
              --dtype {{ effective_vllm_dtype }}
              --max-model-len {{ effective_vllm_max_model_len }}
              --tensor-parallel-size {{ effective_requested_tensor_parallel }}
              --trust-remote-code

        - name: Setup HuggingFace token
          ansible.builtin.include_role:
            name: hf_token
            tasks_from: setup-optional

        - name: Build base environment variables
          ansible.builtin.set_fact:
            vllm_env_vars:
              VLLM_CPU_KVCACHE_SPACE: "{{ effective_vllm_kvcache_space | extract_size_value }}"
              # VLLM_CPU_NUM_OF_RESERVED_CPU: Reserve cores for control plane (scheduler, KV cache, async ops)
              # IMPORTANT: Only works when VLLM_CPU_OMP_THREADS_BIND=auto (default for TP=1)
              # Default behavior without this: world_size==1 reserves 0 cores, world_size>1 reserves 1/rank
              # We explicitly set 2 to prevent worker threads from starving control plane
              VLLM_CPU_NUM_OF_RESERVED_CPU: "{{ vllm_control_plane_cores | string }}"
              HF_TOKEN: "{{ hf_token | default('') }}"
          no_log: true

        # For TP=1: Leave VLLM_CPU_OMP_THREADS_BIND unset (defaults to 'auto')
        # This allows VLLM_CPU_NUM_OF_RESERVED_CPU to work properly
        # vLLM will auto-manage thread binding to NUMA nodes and respect reserved cores

        # For TP>1: Set OMP variables explicitly for multi-rank configurations
        - name: Add OMP_NUM_THREADS if TP > 1
          ansible.builtin.set_fact:
            vllm_env_vars: "{{ vllm_env_vars | combine({'OMP_NUM_THREADS': effective_omp_num_threads | string}) }}"
          when:
            - effective_requested_tensor_parallel | int > 1
            - effective_omp_num_threads is defined
          no_log: true

        - name: Add VLLM_CPU_OMP_THREADS_BIND if TP > 1
          ansible.builtin.set_fact:
            vllm_env_vars: "{{ vllm_env_vars | combine({'VLLM_CPU_OMP_THREADS_BIND': omp_threads_bind}) }}"
          when:
            - effective_requested_tensor_parallel | int > 1
            - omp_threads_bind is defined
            - omp_threads_bind != ''
          no_log: true
          # NOTE: Setting VLLM_CPU_OMP_THREADS_BIND to explicit CPU list disables
          # VLLM_CPU_NUM_OF_RESERVED_CPU. Only set for TP>1 where we manage binding manually.

        - name: Start vLLM audio server with audio-enabled image
          containers.podman.podman_container:
            name: "{{ container_name }}"
            image: "{{ vllm_audio_image }}"
            state: started
            restart_policy: "no"
            detach: true
            network: "{{ container_runtime.network_mode }}"
            cpuset_cpus: "{{ '0-' + ((requested_cores | int) - 1) | string }}"
            cpuset_mems: "{{ numa_node }}"
            shm_size: "{{ container_runtime.shm_size }}"
            security_opt: "{{ container_runtime.security_opts }}"
            cap_add: "{{ container_runtime.capabilities }}"
            volumes:
              - "{{ model_cache_dir }}:/root/.cache/huggingface:rw,z"
              - "{{ log_dir }}:/var/log/vllm:rw,z"
            env: "{{ vllm_env_vars }}"
            command: "{{ vllm_command }}"
            log_driver: journald
            log_opt:
              tag: "vllm-audio-{{ actual_model | replace('/', '__') }}"
          register: vllm_container
          no_log: true

        - name: Display vLLM container start info
          ansible.builtin.debug:
            msg:
              - "✅ vLLM Audio Server Started"
              - "   Container: {{ container_name }}"
              - "   Image: {{ vllm_audio_image }} (with audio support)"
              - "   URL: http://{{ ansible_host }}:{{ vllm_server.port }}"
              - "   Model: {{ actual_model }}"
              - "   Cores: {{ requested_cores }} ({{ '0-' + ((requested_cores | int) - 1) | string }})"
              - "   Tensor Parallel: {{ effective_requested_tensor_parallel }}"
              - "   Logs: journalctl -t vllm-audio-{{ actual_model | replace('/', '__') }} -f"

        - name: Wait for vLLM server to be ready
          ansible.builtin.include_tasks: tasks/wait-for-vllm-ready.yml
          vars:
            vllm_host: "{{ ansible_host }}"
            vllm_port: "{{ vllm_server.port }}"

        - name: Query vLLM version from managed server
          ansible.builtin.uri:
            url: "http://{{ ansible_host }}:{{ vllm_server.port }}/version"
            method: GET
            status_code: [200]
            validate_certs: false
          register: managed_vllm_version
          failed_when: false

        - name: Save vLLM version to localhost (managed)
          ansible.builtin.set_fact:
            vllm_version: "{{ managed_vllm_version.json.version | default('unknown') }}"
          delegate_to: localhost
          delegate_facts: true
          when: managed_vllm_version.status | default(0) == 200

# ============================================================================
# Run Audio Benchmark Stages
# ============================================================================

- name: "Execute Audio Benchmark Stages"
  hosts: load_generator
  become: "{{ ansible_become | default(true) | bool }}"
  gather_facts: true

  vars:
    vllm_mode: "{{ vllm_endpoint.mode | default('managed') }}"
    # Pull variables from localhost facts
    test_model: "{{ hostvars['localhost']['test_model'] }}"
    actual_model: "{{ hostvars['localhost']['actual_model'] }}"
    test_scenario: "{{ hostvars['localhost']['test_scenario'] }}"
    scenario_config: "{{ hostvars['localhost']['scenario_config'] }}"
    scenario_stages: "{{ hostvars['localhost']['scenario_stages'] }}"
    scenario_dataset: "{{ hostvars['localhost']['scenario_dataset'] }}"
    scenario_request_type: "{{ hostvars['localhost']['scenario_request_type'] }}"
    target_url: "{{ vllm_endpoint.external.url if vllm_mode == 'external' else 'http://' + bench_config.vllm_host + ':' + (vllm_server.port | string) }}"
    test_run_id: "{{ hostvars['localhost']['test_run_id'] }}"
    # Remote results path on load generator (matches LLM pattern)
    results_base: "{{ bench_config.results_dir }}/audio-models/{{ actual_model | replace('/', '__') }}/{{ test_scenario }}-{{ hostvars['localhost']['test_run_id'] }}"

  pre_tasks:
    - name: Get SSH user home directory for tilde expansion
      ansible.builtin.shell: "echo ~{{ ansible_user }}"
      register: ssh_user_home
      changed_when: false
      become: false

    - name: Expand tilde in bench_config.results_dir
      ansible.builtin.set_fact:
        bench_config: "{{ bench_config | combine({'results_dir': bench_config.results_dir | regex_replace('^~', ssh_user_home.stdout)}) }}"
      when: bench_config.results_dir is defined and bench_config.results_dir is string

    - name: Record benchmark start time
      ansible.builtin.set_fact:
        benchmark_start_time: "{{ lookup('pipe', 'date +%s') }}"
      delegate_to: localhost
      delegate_facts: true

    - name: Start vLLM metrics collection
      ansible.builtin.include_tasks: tasks/start-vllm-metrics-collection.yml
      vars:
        results_path: "{{ results_base }}"
        test_run_id: "{{ hostvars['localhost']['test_run_id'] }}"

    - name: Verify load generator can reach vLLM server
      ansible.builtin.uri:
        url: "http://{{ bench_config.vllm_host }}:{{ bench_config.vllm_port }}/health"
        method: GET
        status_code: 200
        validate_certs: false
        timeout: 10
      register: loadgen_connectivity_check
      retries: 3
      delay: 2
      until: loadgen_connectivity_check.status == 200
      failed_when: false

    - name: Display connectivity check result
      ansible.builtin.debug:
        msg:
          - "Load Generator → vLLM Connectivity: {{ 'PASS ✓' if loadgen_connectivity_check.status == 200 else 'FAIL ✗' }}"
          - "Target: http://{{ bench_config.vllm_host }}:{{ bench_config.vllm_port }}/health"
          - "Status: {{ loadgen_connectivity_check.status | default('No response') }}"

    - name: Fail if load generator cannot reach vLLM
      ansible.builtin.fail:
        msg: |
          Load generator cannot connect to vLLM server at http://{{ bench_config.vllm_host }}:{{ bench_config.vllm_port }}

          Possible causes:
          - DNS resolution failure (check /etc/hosts or DNS server)
          - Firewall/security group blocking port {{ bench_config.vllm_port }}
          - vLLM server not listening on external interface

          Verify with: curl -v http://{{ bench_config.vllm_host }}:{{ bench_config.vllm_port }}/health
      when: loadgen_connectivity_check.status != 200

  tasks:
    - name: Setup results directory on load generator
      ansible.builtin.file:
        path: "{{ results_base }}"
        state: directory
        mode: "0755"
        recurse: true

    - name: Run each benchmark stage
      ansible.builtin.include_role:
        name: benchmark_guidellm_audio
      vars:
        stage_results_path: "{{ results_base }}/{{ stage.result_filename_suffix }}"
      loop: "{{ scenario_stages }}"
      loop_control:
        loop_var: stage
        index_var: stage_index

  post_tasks:
    - name: Record benchmark end time
      ansible.builtin.set_fact:
        benchmark_end_time: "{{ lookup('pipe', 'date +%s') }}"
      delegate_to: localhost
      delegate_facts: true

    - name: Calculate test duration
      ansible.builtin.set_fact:
        test_duration_seconds: "{{ (hostvars['localhost']['benchmark_end_time'] | int) - (hostvars['localhost']['benchmark_start_time'] | int) }}"
      delegate_to: localhost
      delegate_facts: true

    - name: Format test duration as human readable
      ansible.builtin.set_fact:
        test_duration_string: "{{ ((hostvars['localhost']['test_duration_seconds'] | int) // 60) | string + 'm ' + ((hostvars['localhost']['test_duration_seconds'] | int) % 60) | string + 's' }}"
      delegate_to: localhost
      delegate_facts: true

    - name: Create test metadata JSON on load generator
      ansible.builtin.copy:
        content: |
          {
            "test_run_id": "{{ hostvars['localhost']['test_run_id'] }}",
            "test_type": "audio_benchmark",
            "scenario_name": "{{ test_scenario }}",
            "scenario_type": "{{ hostvars['localhost']['scenario_type'] }}",
            "scenario_description": "{{ hostvars['localhost']['scenario_description'] }}",
            "core_count": {{ hostvars['localhost']['requested_cores'] | default(0) }},
            "tensor_parallel": {{ hostvars['localhost']['effective_requested_tensor_parallel'] | default(1) }},
            "omp_num_threads": {{ hostvars['localhost']['effective_omp_num_threads'] | default('null') }},
            "model": "{{ actual_model }}",
            "platform": "{{ hostvars['localhost']['dut_platform_name'] | default('unknown') }}",
            "backend": "{{ hostvars['localhost']['vllm_backend'] | default('upstream') }}",
            "vllm_version": "{{ hostvars['localhost']['vllm_version'] | default('unknown') }}",
            "vllm_dtype": "{{ hostvars['localhost']['effective_vllm_dtype'] }}",
            "vllm_kv_cache_size": "{{ hostvars['localhost']['effective_vllm_kvcache_space'] }}",
            "vllm_max_model_len": {{ hostvars['localhost']['effective_vllm_max_model_len'] }},
            "vllm_mode": "{{ vllm_mode }}",
            "vllm_endpoint_url": "{{ vllm_endpoint.external.url if vllm_mode == 'external' else 'n/a' }}",
            "guidellm_version": "{{ hostvars['localhost']['guidellm_version'] | default('unknown') }}",
            "request_type": "{{ scenario_request_type }}",
            "dataset_name": "{{ scenario_dataset.name }}",
            "dataset_config": "{{ scenario_dataset.config | default('clean') }}",
            "dataset_split": "{{ scenario_dataset.split | default('test') }}",
            "audio_format": "{{ scenario_config.test_scenario.audio_config.format | default('mp3') }}",
            "audio_bitrate": "{{ scenario_config.test_scenario.audio_config.bitrate | default('64k') }}",
            "audio_sample_rate": {{ scenario_config.test_scenario.audio_config.sample_rate | default(16000) }},
            "stages_completed": {{ scenario_stages | length }},
            "stages": {{ scenario_stages | to_json }},
            "timestamp": "{{ lookup('pipe', 'date -Iseconds') }}",
            "test_duration": "{{ hostvars['localhost']['test_duration_string'] }}",
            "test_duration_seconds": {{ hostvars['localhost']['test_duration_seconds'] }}
          }
        dest: "{{ results_base }}/test-metadata.json"

    - name: Ensure local results directory exists on controller
      ansible.builtin.file:
        path: "{{ hostvars['localhost']['local_results_base'] }}/audio-models/{{ actual_model | replace('/', '__') }}/{{ test_scenario }}-{{ test_run_id }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Fetch results to controller
      block:
        - name: Fetch results via synchronize
          ansible.posix.synchronize:
            src: "{{ results_base }}/"
            dest: "{{ hostvars['localhost']['local_results_base'] }}/audio-models/{{ actual_model | replace('/', '__') }}/{{ test_scenario }}-{{ test_run_id }}/"
            mode: pull
            recursive: true
      rescue:
        - name: Note synchronize fallback
          ansible.builtin.debug:
            msg: >-
              Result sync via synchronize failed; falling back to per-file fetch.
              Per-stage files (benchmarks.json, benchmarks.csv, stage-metadata.json)
              were already fetched by the role; only test-metadata.json needs rescue.

        - name: Fetch test-metadata.json (fallback)
          ansible.builtin.fetch:
            src: "{{ results_base }}/test-metadata.json"
            dest: "{{ hostvars['localhost']['local_results_base'] }}/audio-models/{{ actual_model | replace('/', '__') }}/{{ test_scenario }}-{{ test_run_id }}/test-metadata.json"
            flat: true
          failed_when: false

    - name: Stop vLLM metrics collection
      ansible.builtin.include_tasks: tasks/stop-vllm-metrics-collection.yml

# ============================================================================
# Quality Evaluation (transcription-quality scenario only)
# ============================================================================

- name: "Run Quality Evaluation (WER/CER)"
  hosts: localhost
  gather_facts: false

  vars:
    vllm_mode: "{{ vllm_endpoint.mode | default('managed') }}"
    actual_model: "{{ hostvars['localhost']['actual_model'] }}"
    test_scenario: "{{ hostvars['localhost']['test_scenario'] }}"
    test_run_id: "{{ hostvars['localhost']['test_run_id'] }}"
    requested_cores: "{{ hostvars['localhost']['requested_cores'] | default(0) }}"
    scenario_config: "{{ hostvars['localhost']['scenario_config'] }}"
    scenario_dataset: "{{ hostvars['localhost']['scenario_dataset'] }}"
    local_results_dir: "{{ hostvars['localhost']['local_results_base'] }}/audio-models/{{ actual_model | replace('/', '__') }}/{{ test_scenario }}-{{ test_run_id }}"
    quality_endpoint: "{{ vllm_endpoint.external.url | default('') if vllm_mode == 'external' else 'http://' + hostvars['dut']['ansible_host'] + ':' + (vllm_server.port | default(8000) | string) }}"

  tasks:
    - name: Run evaluate_audio_quality.py
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/../scripts/ansible/evaluate_audio_quality.py
          --endpoint {{ quality_endpoint }}
          --output-dir {{ local_results_dir }}
          --model {{ actual_model }}
          --num-clips {{ scenario_config.test_scenario.dataset.num_samples | default(50) }}
          --dataset {{ scenario_dataset.name | default('openslr/librispeech_asr') }}
          --dataset-config {{ scenario_dataset.config | default('clean') }}
          --dataset-split {{ scenario_dataset.split | default('test') }}
          --test-run-id {{ test_run_id }}
          --cores {{ requested_cores }}
      changed_when: false
      failed_when: false
      register: quality_eval_result
      when:
        - audio_run_quality_eval | default(true) | bool
        - test_scenario == 'transcription-quality'

    - name: Display quality evaluation result
      ansible.builtin.debug:
        msg: "{{ quality_eval_result.stdout_lines | default(['Quality evaluation skipped']) }}"
      when:
        - quality_eval_result is defined
        - quality_eval_result.stdout_lines is defined

    - name: Warn if quality evaluation failed (missing deps?)
      ansible.builtin.debug:
        msg: >-
          Quality evaluation exited with rc={{ quality_eval_result.rc }}.
          Ensure controller has: pip install jiwer datasets soundfile requests
      when:
        - quality_eval_result is defined
        - quality_eval_result.rc is defined
        - quality_eval_result.rc != 0

# ============================================================================
# Cleanup (Managed Mode Only)
# ============================================================================

- name: "Cleanup vLLM Server"
  hosts: dut
  become: "{{ ansible_become | default(true) | bool }}"
  vars:
    vllm_mode: "{{ vllm_endpoint.mode | default('managed') }}"
    test_run_id: "{{ hostvars['localhost']['test_run_id'] }}"
    container_name: "vllm-audio-{{ hostvars['localhost']['test_run_id'] }}"

  tasks:
    - name: Stop vLLM audio server (managed mode only)
      containers.podman.podman_container:
        name: "{{ container_name }}"
        state: stopped
      when: vllm_mode == 'managed'
      ignore_errors: true

    - name: Remove vLLM audio container (managed mode only)
      containers.podman.podman_container:
        name: "{{ container_name }}"
        state: absent
      when: vllm_mode == 'managed'
      ignore_errors: true

# ============================================================================
# Results Summary
# ============================================================================

- name: "Display Results Summary"
  hosts: localhost
  gather_facts: false

  vars:
    local_results_dir: "{{ local_results_base }}/audio-models/{{ actual_model | replace('/', '__') }}/{{ test_scenario }}-{{ test_run_id }}"

  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════════════════════════╗"
          - "║              Audio Benchmark Complete                       ║"
          - "╠══════════════════════════════════════════════════════════════╣"
          - "  Test Scenario: {{ scenario_name }}"
          - "  Model: {{ actual_model }}"
          - "  Stages Completed: {{ scenario_stages | length }}"
          - "  Results Directory: {{ local_results_dir }}"
          - "╚══════════════════════════════════════════════════════════════╝"

    - name: Generate enterprise report
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/../scripts/ansible/audio_enterprise_report.py
          {{ local_results_dir }}
          --p95-target {{ audio_p95_target | default('2.0') }}
      register: enterprise_report
      changed_when: false
      failed_when: false
      when: audio_print_enterprise_report | default(true) | bool

    - name: Display enterprise report
      ansible.builtin.debug:
        msg: "{{ enterprise_report.stdout_lines }}"
      when:
        - enterprise_report is defined
        - enterprise_report.stdout_lines | default([]) | length > 0

    - name: Display enterprise report failure
      ansible.builtin.debug:
        msg:
          - "⚠️  Enterprise report script failed (rc={{ enterprise_report.rc | default('unknown') }})"
          - "{{ enterprise_report.stderr_lines | default([]) }}"
      when:
        - enterprise_report is defined
        - enterprise_report.rc | default(0) != 0
