---
# vLLM Scale-Out Role - Default Variables
# These can be overridden in inventory or playbook

# Deployment configuration
scaleout_num_instances: 5
scaleout_cores_per_instance: 32
scaleout_start_core: 32
scaleout_enable_smt: false
scaleout_enable_prefix_caching: true

# CPU cores for Envoy proxy (handles all client I/O — dedicate enough for concurrency)
scaleout_envoy_cores: "1-7"

# CPU cores for EPP (scores every request — needs to be fast and uncontested)
scaleout_epp_cores: "8-15"

# Base port for vLLM instances (each instance gets base_port + index)
# Instance 1: base_port, Instance 2: base_port+1, Instance 3: base_port+2, ...
scaleout_vllm_base_port: 8000

# Container configuration
scaleout_vllm_image: "docker.io/vllm/vllm-openai-cpu:v0.25.1"
# Pinned to a release tag for reproducible benchmarks — override to upgrade.
scaleout_epp_image: "ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.11.0"
scaleout_envoy_image: "docker.io/envoyproxy/envoy:distroless-v1.33.2"
scaleout_volume_name: "hf-cache"

# Routing policy:
#   intelligent  — EPP selects backend via prefix-cache + queue + KV-utilisation scoring (default)
#   round_robin  — Envoy round-robin across all vLLM instances; EPP is not started
# Use both policies across separate benchmark runs to measure the routing overhead/benefit.
scaleout_routing_policy: "intelligent"

# EPP (Endpoint Picker) configuration
scaleout_epp_grpc_port: 9002       # gRPC ext_proc port (Envoy → EPP)
scaleout_epp_health_port: 9003     # gRPC health check port
scaleout_epp_metrics_port: 9090    # Prometheus metrics

# EPP scorer weights (only used when scaleout_routing_policy == 'intelligent')
# Higher weight = stronger influence on backend selection.
# Equal weights produce load-aware round-robin behaviour.
scaleout_epp_prefix_cache_weight: 3   # Steer to instance with matching KV-cache prefix
scaleout_epp_queue_weight: 2          # Steer to instance with shortest request queue
scaleout_epp_kv_cache_weight: 2       # Steer away from instances under KV-cache pressure
scaleout_epp_lru_weight: 2            # LRU fallback when no prefix match exists

# Envoy configuration
scaleout_envoy_port: 8081          # Client-facing inference endpoint
scaleout_envoy_admin_port: 19000   # Admin interface (/ready, /clusters, /stats)
# Envoy worker threads — set to match the number of cores in scaleout_envoy_cores
# Default: 7 (cores 1-7 = 7 cores).  Adjust when you change scaleout_envoy_cores.
scaleout_envoy_concurrency: 7

# Model configuration (override from inventory)
scaleout_model_name: "{{ test_model | default('RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w8a8') }}"

# HuggingFace token — accepts hf_token (passed via -e) or HF_TOKEN env var
scaleout_hf_token: "{{ hf_token | default(lookup('env', 'HF_TOKEN'), true) }}"

# Health check settings
# First-run LMCache deployments need extra time: pip install lmcache (~3 min) +
# inductor model compilation (~20-40 min for large LLMs on CPU, first run only).
# Subsequent runs are much faster once the pip cache and inductor cache are warm.
scaleout_health_check_retries: 240
scaleout_health_check_delay: 10

# Directories
scaleout_config_dir: "/tmp/vllm-scaleout"
scaleout_model_cache_dir: "{{ model_cache_dir | default('/var/lib/vllm-models') }}"

# Task type for vLLM serving (leave empty for auto-detection, which covers most LLM and embedding models)
# Set explicitly when vLLM cannot auto-detect:
#   - "embed"       : encoder-only embedding models (e.g. Nomic, E5-mistral)
#   - "generate"    : forced generation mode
#   - "transcription": audio/Whisper models for ASR
# scaleout_vllm_task: ""

# Max model length (tokens). Recommended for embedding benchmarks to match ISL (e.g. 512).
# Leave unset to use the model's default context window.
# scaleout_vllm_max_model_len: 512

# Fraction of system RAM vLLM reserves for the KV cache (0.0–1.0).
# On the CPU backend this flag controls RAM despite being named gpu-memory-utilization.
# Default 0.9 matches vLLM's own default and is fine for baseline deployments.
# When running with LMCache (scaleout_lmcache_backend=remote) the lmcache-server
# process allocates its L1 pool (scaleout_lmcache_server_l1_size_gb) BEFORE the
# vLLM instances start.  That memory is already gone, so each vLLM instance must
# be given a smaller budget.
#
# Rule of thumb for LMCache deployments:
#   utilization ≤ (total_ram_GiB - lmcache_l1_gb - os_overhead_gb)
#                 / (total_ram_GiB × num_instances)
# Example (92 GiB host, 10 GB pool, 2 instances, ~4 GB OS):
#   (92 - 10 - 4) / (92 × 2) ≈ 0.42  → use 0.4
scaleout_vllm_gpu_memory_utilization: 0.9

# Advanced vLLM options (optional)
scaleout_vllm_extra_args: []
# Example:
# scaleout_vllm_extra_args:
#   - "--dtype"
#   - "bfloat16"

# LMCache cross-instance KV sharing
#
# Uses LMCacheMPConnector with lmcache_driven transfer mode: vLLM instances
# access shared KV blocks via POSIX shared-memory handles — zero-copy on a
# single host, ~RAM bandwidth rather than a TCP memcpy.
#
# Requires the external `lmcache` PyPI package.  If it is absent from the
# vLLM image the role installs it at container start-up via pip.
#
# scaleout_lmcache_backend:
#   "none"   — disabled (default); per-instance vLLM prefix caching used
#              when scaleout_enable_prefix_caching=true
#   "remote" — lmcache-server container added to the stack; all vLLM
#              instances connect via LMCacheMPConnector (lmcache_driven).
#              vLLM's own prefix caching is disabled — LMCache is the
#              caching layer.  scaleout_enable_prefix_caching is ignored.
scaleout_lmcache_backend: "none"

# lmcache-server — runs in the same vLLM image (pip-installs lmcache if needed)
scaleout_lmcache_server_port: 5555          # RPC port vLLM instances connect to
scaleout_lmcache_server_http_port: 8088     # HTTP metrics / bench endpoint
# L1 (in-memory) pool size for the lmcache server (GB).
# Size this to comfortably hold the shared-prefix working set across all
# instances.  Each instance's own vLLM KV cache is separate and additional.
scaleout_lmcache_server_l1_size_gb: 10

# EPP secondary-tier scorer (used when scaleout_lmcache_backend == "remote").
# lruCapacityPerServer must be set manually — vLLM does not export
# secondary-tier block counts.
# Rough sizing: (server_l1_size_gb × 1024) / avg_kv_block_size_mb
# where avg_kv_block_size_mb ≈ 0.5–2 MB depending on model + sequence length.
scaleout_lmcache_lru_capacity_per_server: 10000
# Weight for the LMCache tier scorer in EPP (secondary tier after in-memory).
scaleout_lmcache_scorer_weight: 2

# What vLLM does if the LMCache connector fails to initialize.
#   "fail"     — vLLM exits (default; correct for production)
#   "recompute"— vLLM logs the LMCache error and falls back to recomputing KV
#                (use for debugging: lets you see the actual error and confirm
#                the rest of the stack works, then fix LMCache)
scaleout_lmcache_kv_failure_policy: "fail"

# Hugepages for the lmcache-server shared memory pool
#
# Why 1 GB hugepages?
#   The lmcache server maps a large shared-memory pool that every vLLM instance
#   mmap-maps concurrently.  With default 4 KB pages a 10 GB pool requires
#   2,621,440 TLB entries per process — far beyond any CPU's TLB capacity
#   (~1 K–4 K entries).  Each TLB miss causes a page-table walk, adding latency
#   and bus traffic during high-concurrency inference.
#
#   With 1 GB pages the same pool needs only 10 TLB entries — TLB pressure
#   essentially disappears.  2 MB pages are the next best option (5,120 entries)
#   and are promoted automatically by Transparent Hugepages (THP).
#
# Transparent Hugepages (THP=always) is always enabled as a baseline when
# scaleout_lmcache_hugepages_enabled=true; the kernel promotes eligible 2 MB
# regions without application changes.
#
# Explicit 1 GB hugepages require:
#   1. CPU support: pdpe1gb CPUID flag (all modern Intel Xeon / AMD EPYC)
#   2. Pre-allocation at or near boot (before memory fragmentation)
#   3. The lmcache server must call mmap(MAP_HUGETLB | MAP_HUGE_1GB) internally
#
# The role pre-allocates 1 GB hugepages and mounts /dev/hugepages1G into the
# lmcache-server container so the pages are available if lmcache supports them.
scaleout_lmcache_hugepages_enabled: false
# Number of 1 GB hugepages to pre-allocate.
# Set to at least scaleout_lmcache_server_l1_size_gb (round up).
scaleout_lmcache_hugepages_1g_count: "{{ scaleout_lmcache_server_l1_size_gb | int }}"

# SMT core offset (system-specific, adjust based on topology)
scaleout_smt_offset: 192
scaleout_smt_cores_per_instance: 8
