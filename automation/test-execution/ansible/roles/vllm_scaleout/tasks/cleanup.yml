---
# Cleanup tasks for vLLM scale-out deployment (llm-d: EPP + Envoy)
# This can be imported by other playbooks

- name: Stop Envoy container
  containers.podman.podman_container:
    name: vllm-envoy
    state: absent
  ignore_errors: true
  when: true

- name: Stop EPP container
  containers.podman.podman_container:
    name: vllm-epp
    state: absent
  ignore_errors: true
  when: true

- name: Stop all vLLM containers
  containers.podman.podman_container:
    name: "vllm-instance-{{ item }}"
    state: absent
  loop: "{{ range(1, scaleout_num_instances | int + 1) | list }}"
  ignore_errors: true
  when: true

- name: Display cleanup completion
  ansible.builtin.debug:
    msg: "vLLM scale-out cleanup completed (Envoy, EPP, and {{ scaleout_num_instances }} vLLM instances removed)"
