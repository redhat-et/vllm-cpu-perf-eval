---
# vLLM Scale-Out Deployment Tasks (llm-d: EPP + Envoy)

- name: Display scale-out configuration
  ansible.builtin.debug:
    msg:
      - "vLLM Scale-Out Deployment Configuration:"
      - "  Routing policy: {{ scaleout_routing_policy }}"
      - "  Instances: {{ scaleout_num_instances }}"
      - "  Cores per instance: {{ scaleout_cores_per_instance }}"
      - "  Start core: {{ scaleout_start_core }}"
      - "  SMT enabled: {{ scaleout_enable_smt }}"
      - "  Prefix caching: {{ 'Disabled (LMCache owns caching)' if scaleout_lmcache_backend == 'remote' else (scaleout_enable_prefix_caching | ternary('Enabled', 'Disabled')) }}"
      - "  LMCache backend: {{ scaleout_lmcache_backend }}"
      - "  {{ 'LMCache server L1 pool: ' + scaleout_lmcache_server_l1_size_gb | string + ' GB  port: ' + scaleout_lmcache_server_port | string if scaleout_lmcache_backend == 'remote' else '' }}"
      - "  {{ 'Hugepages: 1 GB × ' + scaleout_lmcache_hugepages_1g_count | string + ' pre-allocated + THP=always' if (scaleout_lmcache_backend == 'remote' and scaleout_lmcache_hugepages_enabled) else '' }}"
      - "  vLLM ports: {{ scaleout_vllm_base_port }} - {{ scaleout_vllm_base_port | int + scaleout_num_instances | int - 1 }}"
      - "  Envoy port (client): {{ scaleout_envoy_port }}"
      - "  EPP gRPC port: {{ scaleout_epp_grpc_port }} ({{ 'enabled' if scaleout_routing_policy == 'intelligent' else 'disabled for round_robin' }})"
      - "  Model: {{ scaleout_model_name }}"

- name: Calculate CPU sets for each instance
  ansible.builtin.set_fact:
    scaleout_instance_cpusets: >-
      {{
        scaleout_instance_cpusets | default([]) +
        [
          (
            (scaleout_start_core | int + (item - 1) * scaleout_cores_per_instance | int) | string + '-' +
            (scaleout_start_core | int + item * scaleout_cores_per_instance | int - 1) | string +
            (
              (',' + (scaleout_smt_offset | int + (item - 1) * scaleout_smt_cores_per_instance | int) | string + '-' +
              (scaleout_smt_offset | int + item * scaleout_smt_cores_per_instance | int - 1) | string)
              if scaleout_enable_smt else ''
            )
          )
        ]
      }}
  loop: "{{ range(1, scaleout_num_instances | int + 1) | list }}"

- name: Display calculated CPU sets
  ansible.builtin.debug:
    msg:
      - "Calculated CPU sets:"
      - "{{ scaleout_instance_cpusets }}"

- name: Read available CPU cores on this host
  ansible.builtin.command: cat /sys/devices/system/cpu/online
  register: _scaleout_cpu_online
  changed_when: false

- name: Verify requested CPU cores exist on this host
  ansible.builtin.shell: |
    python3 - "{{ _scaleout_cpu_online.stdout | trim }}" "{{ (scaleout_instance_cpusets + [scaleout_envoy_cores] + ([scaleout_epp_cores] if scaleout_routing_policy == 'intelligent' else [])) | join(',') }}" <<'PYEOF'
    import sys

    def expand(spec):
        cpus = set()
        for part in spec.split(','):
            part = part.strip()
            if not part:
                continue
            if '-' in part:
                lo, hi = part.split('-', 1)
                cpus.update(range(int(lo), int(hi) + 1))
            else:
                cpus.add(int(part))
        return cpus

    online = expand(sys.argv[1])
    requested = expand(sys.argv[2])
    missing = sorted(requested - online)
    if missing:
        print(f"Requested CPU cores not present on this host: {missing}")
        print(f"Available cores: {sys.argv[1]}")
        print("Adjust scaleout_start_core, scaleout_cores_per_instance,")
        print("scaleout_envoy_cores, or scaleout_epp_cores and retry.")
        sys.exit(1)
    print(f"OK: all {len(requested)} requested CPU cores are present")
    PYEOF
  changed_when: false

- name: Build vLLM+LMCache image on DUT
  when: scaleout_lmcache_backend == 'remote' and scaleout_lmcache_build_image | bool
  block:
    - name: Copy Containerfile to DUT
      ansible.builtin.copy:
        src: "{{ role_path }}/../../../containers/vllm-cpu-lmcache/Containerfile"
        dest: "/tmp/vllm-cpu-lmcache.Containerfile"
        mode: "0644"

    - name: Check if vllm-cpu-lmcache image already exists
      ansible.builtin.command: podman image exists {{ scaleout_lmcache_image_tag }}
      register: _lmcache_image_exists
      changed_when: false
      failed_when: false

    - name: Build vllm-cpu-lmcache image (lmcache {{ scaleout_lmcache_version }} pre-installed)
      ansible.builtin.shell: |
        podman build \
          --build-arg VLLM_CPU_IMAGE={{ scaleout_vllm_base_image }} \
          --build-arg LMCACHE_VERSION={{ scaleout_lmcache_version }} \
          -t {{ scaleout_lmcache_image_tag }} \
          -f /tmp/vllm-cpu-lmcache.Containerfile \
          /tmp/
      when: _lmcache_image_exists.rc != 0
      changed_when: true
      register: _lmcache_build

    - name: Display build output
      ansible.builtin.debug:
        msg: "{{ _lmcache_build.stdout_lines | default([]) + _lmcache_build.stderr_lines | default([]) }}"
      when: _lmcache_build is changed

    - name: Use built image for this deployment
      ansible.builtin.set_fact:
        scaleout_vllm_image: "{{ scaleout_lmcache_image_tag }}"

- name: Prepare LMCache hugepages and Transparent Hugepages
  when: scaleout_lmcache_backend == 'remote' and scaleout_lmcache_hugepages_enabled | bool
  block:
    - name: Check CPU supports 1 GB hugepages (pdpe1gb flag)
      ansible.builtin.shell: grep -c pdpe1gb /proc/cpuinfo
      register: _pdpe1gb_check
      changed_when: false
      failed_when: false

    - name: Warn if 1 GB hugepages not supported by CPU
      ansible.builtin.debug:
        msg: >-
          WARNING: pdpe1gb CPUID flag not found — this CPU does not support 1 GB
          hugepages.  THP (2 MB pages) will still be enabled as a baseline.
          Set scaleout_lmcache_hugepages_enabled=false to suppress this warning.
      when: _pdpe1gb_check.stdout | int == 0

    - name: Enable Transparent Hugepages (THP=always)
      ansible.builtin.shell: echo always > /sys/kernel/mm/transparent_hugepage/enabled
      changed_when: true

    - name: Pre-allocate 1 GB hugepages
      ansible.builtin.shell: >-
        echo {{ scaleout_lmcache_hugepages_1g_count | int }}
        > /sys/kernel/mm/hugepages/hugepages-1048576kB/nr_hugepages
      changed_when: true
      when: _pdpe1gb_check.stdout | int > 0

    - name: Verify 1 GB hugepages were allocated
      ansible.builtin.shell: >-
        cat /sys/kernel/mm/hugepages/hugepages-1048576kB/nr_hugepages
      register: _hugepages_allocated
      changed_when: false
      when: _pdpe1gb_check.stdout | int > 0

    - name: Fail if hugepages allocation fell short
      ansible.builtin.fail:
        msg: >-
          Requested {{ scaleout_lmcache_hugepages_1g_count }} × 1 GB hugepages but
          only {{ _hugepages_allocated.stdout | trim }} were allocated.  The system
          may have insufficient contiguous free memory.  Try reducing
          scaleout_lmcache_hugepages_1g_count or rebooting with
          hugepages={{ scaleout_lmcache_hugepages_1g_count }} in the kernel command line.
      when:
        - _pdpe1gb_check.stdout | int > 0
        - _hugepages_allocated.stdout | trim | int < scaleout_lmcache_hugepages_1g_count | int

    - name: Mount hugetlbfs for 1 GB pages (if not already mounted)
      ansible.builtin.shell: >-
        mountpoint -q /dev/hugepages1G ||
        (mkdir -p /dev/hugepages1G &&
         mount -t hugetlbfs -o pagesize=1G hugetlbfs /dev/hugepages1G)
      changed_when: true
      when: _pdpe1gb_check.stdout | int > 0

    - name: Display hugepages status
      ansible.builtin.debug:
        msg:
          - "Hugepages configuration:"
          - "  THP: always (kernel promotes 2 MB pages automatically)"
          - "  1 GB pages allocated: {{ _hugepages_allocated.stdout | trim if _pdpe1gb_check.stdout | int > 0 else 'skipped (no pdpe1gb)' }}"
          - "  hugetlbfs mount: /dev/hugepages1G"

- name: Create scale-out configuration directory
  ansible.builtin.file:
    path: "{{ scaleout_config_dir }}"
    state: directory
    mode: "0755"

- name: Generate EPP plugin configuration
  ansible.builtin.template:
    src: epp-config.yaml.j2
    dest: "{{ scaleout_config_dir }}/epp-config.yaml"
    mode: "0644"

- name: Generate EPP endpoints file
  ansible.builtin.template:
    src: epp-endpoints.yaml.j2
    dest: "{{ scaleout_config_dir }}/epp-endpoints.yaml"
    mode: "0644"

- name: Generate Envoy configuration
  ansible.builtin.template:
    src: envoy.yaml.j2
    dest: "{{ scaleout_config_dir }}/envoy.yaml"
    mode: "0644"

- name: Debug resolved image variables before generating compose
  ansible.builtin.debug:
    msg:
      - "scaleout_vllm_base_image  = {{ scaleout_vllm_base_image }}"
      - "scaleout_vllm_image       = {{ scaleout_vllm_image }}"
      - "scaleout_lmcache_image_tag= {{ scaleout_lmcache_image_tag }}"
      - "scaleout_lmcache_version  = {{ scaleout_lmcache_version }}"
      - "scaleout_lmcache_backend  = {{ scaleout_lmcache_backend }}"

- name: Generate docker-compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ scaleout_config_dir }}/docker-compose.yml"
    mode: "0644"

- name: Display generated configuration paths
  ansible.builtin.debug:
    msg:
      - "Configuration files generated at {{ scaleout_config_dir }}:"
      - "  docker-compose.yml  — container orchestration"
      - "  epp-config.yaml     — EPP plugin config (scoring weights)"
      - "  epp-endpoints.yaml  — vLLM worker inventory (live-reloadable)"
      - "  envoy.yaml          — Envoy proxy config"

- name: Create volume for HuggingFace cache
  containers.podman.podman_volume:
    name: "{{ scaleout_volume_name }}"
    state: present
  when: true

- name: Ensure /dev/shm is large enough for LMCache POSIX SHM KV objects
  # lmcache_driven mode wraps each vLLM instance's KV cache tensors as POSIX SHM
  # objects so the lmcache-server can mmap them directly (ipc: host shares /dev/shm).
  #
  # /dev/shm must hold three things:
  #   1. KV SHM objects  : total_ram × gpu_memory_utilization × num_instances
  #   2. lmcache L1 pool : scaleout_lmcache_server_l1_size_gb (separate from KV SHM)
  #   3. vLLM ring buffers: ~160 MiB per instance (multiproc broadcast queue)
  #
  # vLLM's shm_broadcast check uses statvfs(f_bavail) which reports
  # min(size_limit − allocated, free_ram + swap).  Resizing the tmpfs size limit
  # is necessary but not sufficient — the host must also have enough free physical
  # RAM to back the allocations; otherwise statvfs still reports a low number even
  # after remount.
  ansible.builtin.shell: |
    set -e
    python3 -c "
    import math, subprocess, sys

    total_gb   = {{ ansible_facts['memtotal_mb'] | default(65536) }} / 1024
    instances  = {{ scaleout_num_instances | int }}
    util       = {{ scaleout_vllm_gpu_memory_utilization | float }}
    lmcache_l1 = {{ scaleout_lmcache_server_l1_size_gb | int }}

    # KV SHM objects + lmcache L1 + 0.5 GiB per-instance ring-buffer headroom
    kv_shm     = total_gb * util * instances
    vllm_rings = instances * 0.5
    needed     = math.ceil((kv_shm + lmcache_l1 + vllm_rings) * 1.1)

    # Validate host has enough free RAM for lmcache L1 + ring buffers before we
    # start containers.  statvfs reports min(size_limit-allocated, free_ram+swap)
    # so insufficient physical RAM causes the ring-buffer check to fail even when
    # /dev/shm is sized correctly.
    r = subprocess.run(['free', '-m'], capture_output=True, text=True, check=True)
    free_mb = 0
    for line in r.stdout.splitlines():
        if line.startswith('Mem:'):
            free_mb = int(line.split()[6])  # 'available' column
    ring_min_mb = instances * 200           # 200 MiB per instance minimum
    post_l1_free_mb = free_mb - lmcache_l1 * 1024
    if post_l1_free_mb < ring_min_mb:
        print(f'ERROR: Insufficient free RAM for LMCache+vLLM ring buffers.')
        print(f'  Available RAM : {free_mb} MiB')
        print(f'  After L1 pool ({lmcache_l1} GiB): {post_l1_free_mb} MiB free')
        print(f'  vLLM ring buffers need: {ring_min_mb} MiB ({instances} × 200 MiB)')
        print(f'  Fix: reduce scaleout_lmcache_server_l1_size_gb or use a larger host.')
        sys.exit(1)

    print(f'RAM pre-flight OK: {free_mb} MiB available, {post_l1_free_mb} MiB post-L1, need {ring_min_mb} MiB for rings')
    print(f'/dev/shm required: {needed} GiB  (kv_shm={kv_shm:.1f} + l1={lmcache_l1} + rings={vllm_rings:.1f}) × 1.1')
    print(needed, flush=True)
    " > /tmp/_shm_needed_gb.txt
    required_gb=$(tail -1 /tmp/_shm_needed_gb.txt)
    head -n -1 /tmp/_shm_needed_gb.txt
    rm -f /tmp/_shm_needed_gb.txt

    current_kb=$(df --output=size -k /dev/shm | tail -1)
    current_gb=$(( current_kb / 1024 / 1024 ))
    echo "Current /dev/shm: ${current_gb} GiB  →  required: ${required_gb} GiB"
    if [ "${current_gb}" -lt "${required_gb}" ]; then
      echo "Resizing /dev/shm to ${required_gb}g"
      mount -o remount,size=${required_gb}g /dev/shm
      new_kb=$(df --output=size -k /dev/shm | tail -1)
      new_gb=$(( new_kb / 1024 / 1024 ))
      echo "After remount: ${new_gb} GiB"
      if [ "${new_gb}" -lt "${required_gb}" ]; then
        echo "ERROR: /dev/shm remount did not reach ${required_gb} GiB (got ${new_gb} GiB)."
        echo "  The host may lack sufficient RAM+swap to back the tmpfs."
        echo "  Reduce scaleout_lmcache_server_l1_size_gb or scaleout_vllm_gpu_memory_utilization."
        exit 1
      fi
    fi
  become: true
  changed_when: false
  when: scaleout_lmcache_backend == 'remote'

- name: Kill any stale podman-compose processes from previous runs
  # Run pkill in a nohup background so the SIGTERM it sends cannot reach
  # the current SSH session's process group (which caused rc=-15 previously).
  # Also stop and remove any leftover vllm-* containers from failed runs.
  # MUST run BEFORE the SHM cleanup: with ipc: host the lmcache-server also
  # holds POSIX SHM fds open; cleaning SHM while it is still running can
  # race — the server detects the unlinked name and recreates it before the
  # new container starts, causing shm_open(O_CREAT|O_EXCL) EEXIST failures.
  ansible.builtin.shell: |
    nohup bash -c '
      sleep 1
      pkill -f "podman-compose.*docker-compose.yml.*up" 2>/dev/null || true
    ' >/dev/null 2>&1 &
    disown
    podman stop $(podman ps -q --filter name=vllm-) 2>/dev/null || true
    podman rm   $(podman ps -aq --filter name=vllm-) 2>/dev/null || true
    sleep 3
  become: true
  changed_when: false
  ignore_errors: true

- name: Clean stale shared-memory objects from previous runs
  # All containers share the host IPC namespace (ipc: host).
  # Crashed runs can leave stale POSIX SHM objects (/lmcache_kv_<pid>_<idx>)
  # that cause shm_open(O_CREAT|O_EXCL) EEXIST on the next startup.
  # Run AFTER containers are stopped so no running process can recreate the
  # files between unlink and the new container's shm_open.
  ansible.builtin.shell: |
    rm -f /dev/shm/lmcache* \
          /dev/shm/vllm* \
          /dev/shm/__KMP_REGISTERED_LIB_* \
          /dev/shm/sem.mp-* \
          /dev/shm/psm_* \
          2>/dev/null || true
  become: true
  changed_when: false
  when: scaleout_lmcache_backend == 'remote'

- name: Compute expected container count for readiness polling
  ansible.builtin.set_fact:
    scaleout_expected_container_count: "{{ scaleout_num_instances | int + (1 if scaleout_lmcache_backend == 'remote' else 0) + (1 if scaleout_routing_policy == 'intelligent' else 0) + 1 }}"

- name: Deploy and validate the scale-out stack
  block:
    - name: Start vLLM scale-out deployment with docker-compose
      # podman-compose up -d can block in some versions waiting for containers
      # to reach "running" state before returning.  Run async/poll:0 so Ansible
      # never waits on it; the next task polls for actual container presence.
      ansible.builtin.shell:
        cmd: >-
          podman-compose --podman-run-args=--pull=never
          -f {{ scaleout_config_dir }}/docker-compose.yml up -d
          > /tmp/vllm-compose-up.log 2>&1
        chdir: "{{ scaleout_config_dir }}"
      environment:
        PATH: "/usr/local/bin:/usr/bin:/bin:{{ ansible_facts['env']['PATH'] }}"
      async: "{{ scaleout_compose_up_timeout }}"
      poll: 0
      register: compose_up_job

    - name: Wait for all expected containers to appear
      # Count containers whose name starts with "vllm-" — this covers
      # vllm-instance-N, vllm-lmcache-server, vllm-epp, and vllm-envoy.
      ansible.builtin.shell: |
        podman ps --filter "name=vllm-" --format "{{ '{{' }}.Names{{ '}}' }}" | wc -l
      register: running_containers
      retries: 30
      delay: 10
      changed_when: false
      until: running_containers.stdout | int >= scaleout_expected_container_count | int

    - name: Display running containers
      ansible.builtin.shell: |
        podman ps --filter "name=vllm-" --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}"
      register: container_list
      changed_when: false

    - name: Show container status
      ansible.builtin.debug:
        var: container_list.stdout_lines

    - name: Wait for each vLLM instance to become ready
      ansible.builtin.uri:
        url: "http://localhost:{{ scaleout_vllm_base_port | int + item - 1 }}/v1/models"
        method: GET
        status_code: 200
      register: vllm_health
      retries: "{{ scaleout_health_check_retries }}"
      delay: "{{ scaleout_health_check_delay }}"
      until: vllm_health.status == 200
      loop: "{{ range(1, scaleout_num_instances | int + 1) | list }}"

    - name: Wait for EPP metrics endpoint to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ scaleout_epp_metrics_port }}/metrics"
        method: GET
        status_code: 200
      register: epp_health
      retries: "{{ scaleout_health_check_retries }}"
      delay: "{{ scaleout_health_check_delay }}"
      until: epp_health.status == 200
      when: scaleout_routing_policy == 'intelligent'

    - name: Wait for Envoy admin endpoint to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ scaleout_envoy_admin_port }}/ready"
        method: GET
        status_code: 200
      register: envoy_health
      retries: "{{ scaleout_health_check_retries }}"
      delay: "{{ scaleout_health_check_delay }}"
      until: envoy_health.status == 200

    - name: Verify container CPU pinning took effect
      ansible.builtin.shell: |
        python3 - <<'PYEOF'
        import subprocess

        def expand(spec):
            cpus = set()
            for part in spec.split(','):
                part = part.strip()
                if not part:
                    continue
                if '-' in part:
                    lo, hi = part.split('-', 1)
                    cpus.update(range(int(lo), int(hi) + 1))
                else:
                    cpus.add(int(part))
            return cpus

        checks = [
            (f"vllm-instance-{i}", cpuset)
            for i, cpuset in enumerate({{ scaleout_instance_cpusets | to_json }}, start=1)
        ]
        checks.append(("vllm-envoy", {{ scaleout_envoy_cores | to_json }}))
        {% if scaleout_routing_policy == 'intelligent' %}
        checks.append(("vllm-epp", {{ scaleout_epp_cores | to_json }}))
        {% endif %}

        problems = []
        for name, expected in checks:
            result = subprocess.run(
                ["podman", "inspect", "--format", "{{ '{{' }}.HostConfig.CpusetCpus{{ '}}' }}", name],
                capture_output=True, text=True,
            )
            if result.returncode != 0:
                problems.append(f"{name}: podman inspect failed: {result.stderr.strip()}")
                continue
            actual = result.stdout.strip()
            if expand(actual) != expand(expected):
                problems.append(f"{name}: expected cpuset '{expected}', got '{actual}'")
        if problems:
            print("CPU pinning verification FAILED:")
            for problem in problems:
                print(f"  - {problem}")
            raise SystemExit(1)
        print(f"CPU pinning verified: {len(checks)} container(s) match requested cpusets")
        PYEOF
      changed_when: false

    - name: Probe embeddings endpoint through Envoy (smoke test)
      ansible.builtin.uri:
        url: "http://localhost:{{ scaleout_envoy_port }}/v1/embeddings"
        method: POST
        body_format: json
        body:
          model: "{{ scaleout_model_name }}"
          input: "cpueval scale-out smoke test"
        status_code: 200
        timeout: 120
      register: _smoke_embeddings
      failed_when: false
      changed_when: false
      retries: 2
      delay: 5
      until: _smoke_embeddings.status | default(0) == 200
      when: scaleout_vllm_task | default('') != 'generate'

    - name: Probe completions endpoint through Envoy (smoke test)
      ansible.builtin.uri:
        url: "http://localhost:{{ scaleout_envoy_port }}/v1/completions"
        method: POST
        body_format: json
        body:
          model: "{{ scaleout_model_name }}"
          prompt: "Smoke test"
          max_tokens: 1
        status_code: 200
        timeout: 120
      register: _smoke_completions
      failed_when: false
      changed_when: false
      retries: 2
      delay: 5
      until: _smoke_completions.status | default(0) == 200
      when:
        - scaleout_vllm_task | default('') != 'embed'
        # Skip when the embeddings probe already proved the routing path —
        # a 400 from the wrong endpoint is expected, not worth retrying.
        - (_smoke_embeddings.status | default(0)) != 200

    - name: Verify smoke request succeeded through the full routing path
      ansible.builtin.assert:
        that:
          - (_smoke_embeddings.status | default(0)) == 200 or (_smoke_completions.status | default(0)) == 200
        success_msg: >-
          Smoke request succeeded: client → Envoy → {{ 'EPP → ' if scaleout_routing_policy == 'intelligent' else '' }}vLLM
          returned a valid response
        fail_msg: >-
          End-to-end smoke request through the routing path failed
          (Envoy :{{ scaleout_envoy_port }} never returned a valid inference response).
          Health endpoints can report ready while ext_proc/EPP routing is misconfigured —
          check Envoy and EPP container logs for routing errors.
      when: scaleout_vllm_task | default('') != 'transcription'

  rescue:
    - name: Display deployment failure details
      ansible.builtin.debug:
        msg:
          - "Scale-out deployment FAILED at task: {{ ansible_failed_task.name }}"
          - "Error: {{ ansible_failed_result.msg | default('') }}"
          - "stderr: {{ ansible_failed_result.stderr_lines | default([]) }}"

    - name: Show podman-compose startup log
      ansible.builtin.shell: |
        echo "=== /tmp/vllm-compose-up.log ==="
        cat /tmp/vllm-compose-up.log 2>/dev/null || echo "(log not found)"
        echo ""
        echo "=== podman ps -a (all containers) ==="
        podman ps -a --filter "name=vllm-" 2>/dev/null || true
      register: _compose_log
      changed_when: false
      failed_when: false

    - name: Display compose log
      ansible.builtin.debug:
        var: _compose_log.stdout_lines

    - name: Tear down partially deployed stack
      ansible.builtin.include_tasks: cleanup.yml

    - name: Abort with guidance
      ansible.builtin.fail:
        msg: >-
          Scale-out deployment failed during '{{ ansible_failed_task.name }}' and the stack
          was torn down. Common causes: image pull failures (registry/auth), invalid model
          name, CPU core configuration, or port conflicts on {{ scaleout_envoy_port }} /
          {{ scaleout_vllm_base_port }}+. Inspect the failure details above before retrying.

- name: Display deployment summary
  ansible.builtin.debug:
    msg:
      - "╔══════════════════════════════════════════════════════════════════╗"
      - "║ vLLM Scale-Out Deployment Successful (llm-d)                     ║"
      - "╚══════════════════════════════════════════════════════════════════╝"
      - ""
      - "Deployment Details:"
      - "  • vLLM instances: {{ scaleout_num_instances }} × {{ scaleout_cores_per_instance }} cores"
      - "  • Routing policy: {{ scaleout_routing_policy }}"
