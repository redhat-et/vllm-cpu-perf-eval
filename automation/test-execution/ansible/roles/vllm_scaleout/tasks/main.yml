      - "  • Prefix caching: {{ 'Disabled (LMCache owns caching — LMCacheMPConnector + engine_driven)' if scaleout_lmcache_backend == 'remote' else scaleout_enable_prefix_caching | ternary('Enabled', 'Disabled') }}"
      - "  • LMCache: {{ 'remote — L1 pool ' + scaleout_lmcache_server_l1_size_gb | string + ' GB on :' + scaleout_lmcache_server_port | string + (' + 1 GB hugepages × ' + scaleout_lmcache_hugepages_1g_count | string + ' + THP=always' if scaleout_lmcache_hugepages_enabled else '') if scaleout_lmcache_backend == 'remote' else 'disabled' }}"
      - "  • End-to-end smoke request through routing path: {{ 'skipped (transcription models)' if scaleout_vllm_task | default('') == 'transcription' else 'passed' }}"
