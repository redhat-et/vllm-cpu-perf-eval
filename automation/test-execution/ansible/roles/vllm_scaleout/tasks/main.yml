      - ""
      - "Observability:"
      - "  • Envoy admin: http://{{ ansible_host }}:{{ scaleout_envoy_admin_port }}/stats"
      - "  • EPP metrics: http://{{ ansible_host }}:{{ scaleout_epp_metrics_port }}/metrics{{ ' (routing decisions, per-backend KV/queue stats)' if scaleout_routing_policy == 'intelligent' else ' (not running — round_robin mode)' }}"
      - ""
      - "Management:"
      - "  • Logs: podman-compose -f {{ scaleout_config_dir }}/docker-compose.yml logs -f"
