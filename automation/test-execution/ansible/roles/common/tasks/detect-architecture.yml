---
# Common task to detect system architecture and select appropriate container images
# This task should be included by roles that need architecture-specific container images

- name: Detect system architecture
  ansible.builtin.command: uname -m
  register: system_arch
  changed_when: false

- name: Set architecture-specific container images
  ansible.builtin.set_fact:
    vllm_server_image_default: >-
      {%- if system_arch.stdout in ['x86_64', 'amd64'] -%}
      docker.io/vllm/vllm-openai-cpu:v0.20.0
      {%- elif system_arch.stdout in ['aarch64', 'arm64'] -%}
      quay.io/mtahhan/vllm:arm-base-cpu
      {%- else -%}
      docker.io/vllm/vllm-openai-cpu:v0.20.0
      {%- endif -%}
    guidellm_image_default: >-
      {%- if system_arch.stdout in ['x86_64', 'amd64'] -%}
      ghcr.io/vllm-project/guidellm:v0.6.0
      {%- elif system_arch.stdout in ['aarch64', 'arm64'] -%}
      ghcr.io/vllm-project/guidellm:v0.6.0
      {%- else -%}
      ghcr.io/vllm-project/guidellm:v0.6.0
      {%- endif -%}

- name: Display detected architecture
  ansible.builtin.debug:
    msg:
      - "Detected architecture: {{ system_arch.stdout }}"
      - "Default vLLM image: {{ vllm_server_image_default }}"
      - "Default GuideLLM image: {{ guidellm_image_default }}"
