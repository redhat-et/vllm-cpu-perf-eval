---
# Common task to detect system architecture and select appropriate container images
# This task should be included by roles that need architecture-specific container images

- name: Detect system architecture
  ansible.builtin.command: uname -m
  register: system_arch
  changed_when: false

- name: Validate supported architecture
  ansible.builtin.fail:
    msg: |
      ❌ Unsupported architecture detected!

      Detected: {{ system_arch.stdout }}
      Supported: x86_64, amd64, aarch64, arm64

      This framework currently supports Intel/AMD x86_64 and ARM aarch64 processors only.
      Other architectures (ppc64le, s390x, riscv64) are not yet supported.

      To add support for {{ system_arch.stdout }}:
        1. Build vLLM container for {{ system_arch.stdout }}
        2. Update detect-architecture.yml with architecture mappings
        3. Test the container images on target platform

      For more information, see: docs/ansible/test-execution.md
  when: system_arch.stdout not in ['x86_64', 'amd64', 'aarch64', 'arm64']

- name: Set architecture-specific container images
  ansible.builtin.set_fact:
    vllm_server_image_default: >-
      {%- if system_arch.stdout in ['x86_64', 'amd64'] -%}
      docker.io/vllm/vllm-openai-cpu:v0.25.1
      {%- elif system_arch.stdout in ['aarch64', 'arm64'] -%}
      quay.io/mtahhan/vllm:arm-base-cpu
      {%- else -%}
      docker.io/vllm/vllm-openai-cpu:v0.25.1
      {%- endif -%}
    guidellm_image_default: ghcr.io/vllm-project/guidellm:v0.7.2

- name: Get actual vLLM image to be used
  ansible.builtin.set_fact:
    vllm_actual_image: "{{ lookup('env', 'VLLM_CONTAINER_IMAGE') | default(vllm_server_image_default, true) }}"

- name: Display detected architecture and container images
  ansible.builtin.debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "Architecture Detection"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "Detected architecture: {{ system_arch.stdout }}"
      - ""
      - "Container Images:"
      - "  vLLM image (default): {{ vllm_server_image_default }}"
      - "  vLLM image (actual):  {{ vllm_actual_image }}"
      - "  {% if vllm_actual_image != vllm_server_image_default %}✓ Using custom image from VLLM_CONTAINER_IMAGE{% else %}Using architecture default{% endif %}"
      - ""
      - "  GuideLLM image: {{ guidellm_image_default }}"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
