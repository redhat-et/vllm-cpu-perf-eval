---
# Latency and concurrent load test tasks
# Included by run-embedding-tests.yml

- name: Detect architecture and set defaults
  ansible.builtin.include_role:
    name: common
    tasks_from: detect-architecture

- name: Set vllm-bench execution mode
  ansible.builtin.set_fact:
    use_vllm_bench_container: "{{ benchmark_tool.vllm_bench.use_container | default(true) | bool }}"
    vllm_bench_image: "{{ benchmark_tool.vllm_bench.container_image | default(vllm_server_image_default) }}"
    num_prompts: "{{ benchmark_tool.vllm_bench.num_prompts | default(250) }}"
    vllm_bench_cpuset_cpus: "{{ vllm_bench_cpus | default(benchmark_tool.vllm_bench.cpuset_cpus | default('')) }}"
    vllm_bench_cpuset_mems: "{{ vllm_bench_numa_node | default(benchmark_tool.vllm_bench.cpuset_mems | default('')) }}"

- name: Build vllm-bench command prefix
  ansible.builtin.set_fact:
    vllm_bench_prefix: >-
      {% if use_vllm_bench_container %}
      podman run --rm --entrypoint="" --network host
      {% if vllm_bench_cpuset_cpus %}--cpuset-cpus {{ vllm_bench_cpuset_cpus }}{% endif %}
      {% if vllm_bench_cpuset_mems %}--cpuset-mems {{ vllm_bench_cpuset_mems }}{% endif %}
      -v "{{ bench_config.results_dir }}":"{{ bench_config.results_dir }}":z
      {{ vllm_bench_image }}
      /opt/venv/bin/vllm bench serve
      {% else %}
      vllm bench serve
      {% endif %}

- name: Ensure latency result directory exists
  ansible.builtin.file:
    path: "{{ results_base_dir }}/latency"
    state: directory
    mode: "0755"

- name: Define concurrency levels to test
  ansible.builtin.set_fact:
    concurrency_levels: [16, 32, 64, 128, 196]

- name: "Latency Test - Run at each concurrency level"
  ansible.builtin.command:
    cmd: >
      {{ vllm_bench_prefix }}
      --host {{ bench_config.vllm_host }}
      --port {{ bench_config.vllm_port }}
      --backend openai-embeddings
      --model "{{ model_name }}"
      --dataset-name random
      --random-input-len {{ embedding_random_input_len | default(512) }}
      --num-prompts {{ num_prompts }}
      --endpoint /v1/embeddings
      --request-rate inf
      --max-concurrency {{ item }}
      --save-result
      --result-filename "{{ results_base_dir }}/latency/concurrent-{{ item }}.json"
  loop: "{{ concurrency_levels }}"
  register: latency_tests
  changed_when: true

- name: Display latency test results summary
  ansible.builtin.debug:
    msg:
      - "Latency tests completed for concurrency levels: {{ concurrency_levels }}"
      - "Results saved to {{ results_base_dir }}/latency/"
      - "Look for P99 latency sweet spot and degradation point"
