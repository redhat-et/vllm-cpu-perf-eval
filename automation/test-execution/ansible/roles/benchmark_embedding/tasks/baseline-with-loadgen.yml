---
# Baseline performance test using load generator abstraction (EXPERIMENTAL)
# This is an alternative to baseline.yml that uses the load generator abstraction layer
# To use: include this task instead of baseline.yml in run-embedding-tests.yml

- name: Generate vllm_bench configuration using load generator abstraction
  ansible.builtin.include_role:
    name: common
    tasks_from: loadgen-command
  vars:
    loadgen_name: "vllm_bench"
    loadgen_config:
      target_url: "http://{{ bench_config.vllm_host }}:{{ bench_config.vllm_port }}"
      model: "{{ model_name }}"
      workload_type: "embedding"
      max_requests: "{{ benchmark_tool.vllm_bench.num_prompts | default(250) }}"
      max_seconds: 600
      rate: "inf"
      output_path: "{{ results_base_dir }}/baseline/sweep-inf.json"
      dataset: "random"
      extra_args:
        random-input-len: "{{ embedding_random_input_len | default(512) }}"
        endpoint: "/v1/embeddings"

- name: Display load generator configuration
  ansible.builtin.debug:
    msg:
      - "Load Generator Abstraction: {{ 'ENABLED' if loadgen_abstraction_used else 'DISABLED (using traditional approach)' }}"
      - "{% if loadgen_abstraction_used %}Image: {{ loadgen_image }}{% endif %}"
      - "{% if loadgen_abstraction_used %}Command: {{ loadgen_cmd | join(' ') }}{% endif %}"

- name: Ensure baseline result directory exists
  ansible.builtin.file:
    path: "{{ results_base_dir }}/baseline"
    state: directory
    mode: "0755"

# Run with abstraction if available
- name: "Baseline Test - Find Maximum Throughput (using load generator abstraction)"
  when: loadgen_abstraction_used | default(false)
  block:
    - name: Get SSH user's home directory
      ansible.builtin.shell: "getent passwd {{ ansible_user }} | cut -d: -f6"
      register: ssh_user_home
      changed_when: false
      become: false

    - name: Expand tilde in results directory path
      ansible.builtin.set_fact:
        expanded_results_dir: "{{ bench_config.results_dir | regex_replace('^~', ssh_user_home.stdout) }}"

    - name: Run vllm bench using abstraction-generated configuration
      ansible.builtin.command:
        cmd: >
          podman run --rm --entrypoint="" --network host
          {% if benchmark_tool.vllm_bench.cpuset_cpus | default('') %}--cpuset-cpus {{ benchmark_tool.vllm_bench.cpuset_cpus }}{% endif %}
          {% if benchmark_tool.vllm_bench.cpuset_mems | default('') %}--cpuset-mems {{ benchmark_tool.vllm_bench.cpuset_mems }}{% endif %}
          -v "{{ expanded_results_dir }}":"{{ expanded_results_dir }}":z
          {{ loadgen_image }}
          /opt/venv/bin/{{ loadgen_cmd | join(' ') }}
      register: baseline_inf_result
      changed_when: true
      environment: "{{ loadgen_env }}"

# Fallback to traditional approach
- name: "Baseline Test - Find Maximum Throughput (traditional approach)"
  when: not (loadgen_abstraction_used | default(false))
  block:
    - name: Get SSH user's home directory
      ansible.builtin.shell: "getent passwd {{ ansible_user }} | cut -d: -f6"
      register: ssh_user_home
      changed_when: false
      become: false

    - name: Expand tilde in results directory path
      ansible.builtin.set_fact:
        expanded_results_dir: "{{ bench_config.results_dir | regex_replace('^~', ssh_user_home.stdout) }}"

    - name: Set vllm-bench execution mode
      ansible.builtin.set_fact:
        use_vllm_bench_container: "{{ benchmark_tool.vllm_bench.use_container | default(true) | bool }}"
        vllm_bench_image: "{{ benchmark_tool.vllm_bench.container_image | default(vllm_server_image_default) }}"
        num_prompts: "{{ benchmark_tool.vllm_bench.num_prompts | default(250) }}"

    - name: Build vllm-bench command prefix
      ansible.builtin.set_fact:
        vllm_bench_prefix: >-
          {% if use_vllm_bench_container %}
          podman run --rm --entrypoint="" --network host
          {% if benchmark_tool.vllm_bench.cpuset_cpus | default('') %}--cpuset-cpus {{ benchmark_tool.vllm_bench.cpuset_cpus }}{% endif %}
          {% if benchmark_tool.vllm_bench.cpuset_mems | default('') %}--cpuset-mems {{ benchmark_tool.vllm_bench.cpuset_mems }}{% endif %}
          -v "{{ expanded_results_dir }}":"{{ expanded_results_dir }}":z
          {{ vllm_bench_image }}
          /opt/venv/bin/vllm bench serve
          {% else %}
          vllm bench serve
          {% endif %}

    - name: Run traditional vllm bench command
      ansible.builtin.command:
        cmd: >
          {{ vllm_bench_prefix }}
          --host {{ bench_config.vllm_host }}
          --port {{ bench_config.vllm_port }}
          --backend openai-embeddings
          --model "{{ model_name }}"
          --dataset-name random
          --random-input-len {{ embedding_random_input_len | default(512) }}
          --num-prompts {{ num_prompts }}
          --request-rate inf
          --endpoint /v1/embeddings
          --save-result
          --result-filename "{{ results_base_dir }}/baseline/sweep-inf.json"
      register: baseline_inf_result
      changed_when: true

# Common validation (both paths)
- name: Set baseline_inf output
  ansible.builtin.set_fact:
    baseline_inf_output: "{{ baseline_inf_result.stdout }}"

- name: Validate baseline test output
  ansible.builtin.assert:
    that:
      - baseline_inf_output is defined
      - baseline_inf_output | length > 0
      - baseline_inf_output is search('Request throughput \(req/s\)')
    fail_msg: |
      Failed to validate vllm bench output. Expected format with 'Request throughput (req/s)' metric.
      Output received: {{ baseline_inf_output | default('No output') }}
    success_msg: "Baseline test output validated"

- name: Parse maximum RPS from inf rate test
  ansible.builtin.set_fact:
    max_rps_match: "{{ baseline_inf_output | regex_search('Request throughput \\(req/s\\):\\s+([0-9.]+)', '\\1') }}"
