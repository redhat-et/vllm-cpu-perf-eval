---
# Baseline performance test tasks (sweep test)
# Included by run-embedding-tests.yml

- name: Detect architecture and set defaults
  ansible.builtin.include_role:
    name: common
    tasks_from: detect-architecture

- name: Set vllm-bench execution mode
  ansible.builtin.set_fact:
    use_vllm_bench_container: "{{ benchmark_tool.vllm_bench.use_container | default(true) | bool }}"
    vllm_bench_image: "{{ benchmark_tool.vllm_bench.container_image | default(vllm_server_image_default) }}"
    num_prompts: "{{ benchmark_tool.vllm_bench.num_prompts | default(250) }}"
    vllm_bench_cpuset_cpus: "{{ vllm_bench_cpus | default(benchmark_tool.vllm_bench.cpuset_cpus | default('')) }}"
    vllm_bench_cpuset_mems: "{{ vllm_bench_numa_node | default(benchmark_tool.vllm_bench.cpuset_mems | default('')) }}"

- name: Validate NUMA pinning configuration
  ansible.builtin.assert:
    that:
      - vllm_bench_cpuset_cpus is match('^[0-9,\\-]*$')
      - vllm_bench_cpuset_mems is match('^[0-9,\\-]*$')
    fail_msg: |
      Invalid CPU/NUMA format.
      vllm_bench_cpuset_cpus must match format: '0-15,32-47' or '0,1,2,3'
      vllm_bench_cpuset_mems must match format: '0' or '0,1'
      Current values:
        cpuset_cpus: {{ vllm_bench_cpuset_cpus }}
        cpuset_mems: {{ vllm_bench_cpuset_mems }}
    success_msg: "NUMA pinning configuration validated"
  when: vllm_bench_cpuset_cpus != '' or vllm_bench_cpuset_mems != ''

- name: Get SSH user's home directory
  ansible.builtin.shell: "getent passwd {{ ansible_user }} | cut -d: -f6"
  register: ssh_user_home
  changed_when: false
  become: false

- name: Expand tilde in results directory path
  ansible.builtin.set_fact:
    expanded_results_dir: "{{ bench_config.results_dir | regex_replace('^~', ssh_user_home.stdout) }}"

- name: Build vllm-bench command prefix
  ansible.builtin.set_fact:
    vllm_bench_prefix: >-
      {% if use_vllm_bench_container %}
      podman run --rm --entrypoint="" --network host
      {% if vllm_bench_cpuset_cpus %}--cpuset-cpus {{ vllm_bench_cpuset_cpus }}{% endif %}
      {% if vllm_bench_cpuset_mems %}--cpuset-mems {{ vllm_bench_cpuset_mems }}{% endif %}
      -v "{{ expanded_results_dir }}":"{{ expanded_results_dir }}":z
      {{ vllm_bench_image }}
      /opt/venv/bin/vllm bench serve
      {% else %}
      vllm bench serve
      {% endif %}

- name: Ensure baseline result directory exists
  ansible.builtin.file:
    path: "{{ results_base_dir }}/baseline"
    state: directory
    mode: "0755"

- name: "Baseline Test - Find Maximum Throughput (inf rate)"
  ansible.builtin.command:
    cmd: >
      {{ vllm_bench_prefix }}
      --host {{ bench_config.vllm_host }}
      --port {{ bench_config.vllm_port }}
      --backend openai-embeddings
      --model "{{ model_name }}"
      --dataset-name random
      --random-input-len {{ embedding_random_input_len | default(512) }}
      --num-prompts {{ num_prompts }}
      --request-rate inf
      --endpoint /v1/embeddings
      --save-result
      --result-filename "{{ results_base_dir }}/baseline/sweep-inf.json"
  register: baseline_inf_result
  changed_when: true

- name: Set baseline_inf output
  ansible.builtin.set_fact:
    baseline_inf_output: "{{ baseline_inf_result.stdout }}"

- name: Validate baseline test output
  ansible.builtin.assert:
    that:
      - baseline_inf_output is defined
      - baseline_inf_output | length > 0
      - baseline_inf_output is search('Request throughput \(req/s\)')
    fail_msg: |
      Failed to validate vllm bench output. Expected format with 'Request throughput (req/s)' metric.
      Output received: {{ baseline_inf_output | default('No output') }}
    success_msg: "Baseline test output validated"

- name: Parse maximum RPS from inf rate test
  ansible.builtin.set_fact:
    max_rps_match: "{{ baseline_inf_output | regex_search('Request throughput \\(req/s\\):\\s+([0-9.]+)', '\\1') }}"

- name: Validate RPS extraction
  ansible.builtin.assert:
    that:
      - max_rps_match is defined
      - max_rps_match | length > 0
      - max_rps_match[0] is defined
    fail_msg: |
      Failed to extract RPS value from output.
      Pattern: 'Request throughput (req/s): <number>'
      Output: {{ baseline_inf_output }}
    success_msg: "RPS value extracted successfully"

- name: Convert RPS to float
  ansible.builtin.set_fact:
    max_rps: "{{ max_rps_match[0] | float }}"

- name: Validate RPS value
  ansible.builtin.assert:
    that:
      - max_rps | float > 0
    fail_msg: "Invalid RPS value: {{ max_rps }}. Expected positive number."
    success_msg: "RPS value validated: {{ max_rps }}"

- name: Set baseline load percentages
  ansible.builtin.set_fact:
    baseline_load_percentages: "{{ baseline_load_percentages | default([25, 50, 75]) }}"

- name: Ensure baseline_load_percentages is provided
  ansible.builtin.assert:
    that:
      - baseline_load_percentages is defined
      - baseline_load_percentages | length > 0
    fail_msg: |
      baseline_load_percentages must be a non-empty list.
      Provided value: {{ baseline_load_percentages | default('undefined') }}
    success_msg: "Baseline load percentages list validated"

- name: Validate each baseline load percentage value
  ansible.builtin.assert:
    that:
      - item | int >= 1
      - item | int <= 100
    fail_msg: |
      Invalid baseline_load_percentages value: {{ item }}
      Each percentage must be an integer between 1 and 100.
      Current list: {{ baseline_load_percentages }}
    success_msg: "Load percentage {{ item }}% is valid"
  loop: "{{ baseline_load_percentages }}"

- name: Check for duplicate baseline load percentages
  ansible.builtin.assert:
    that:
      - baseline_load_percentages | unique | length == baseline_load_percentages | length
    fail_msg: |
      baseline_load_percentages contains duplicate values.
      Current value: {{ baseline_load_percentages }}
      Unique values: {{ baseline_load_percentages | unique }}
    success_msg: "No duplicate percentages found"

- name: Compute planned load rates
  ansible.builtin.set_fact:
    planned_rates: "{{ planned_rates | default([]) + [{'percent': item, 'rate': ((max_rps | float) * (item | float / 100)) | round(2)}] }}"
  loop: "{{ baseline_load_percentages }}"

- name: Display maximum RPS and planned load tests
  ansible.builtin.debug:
    msg:
      - "Maximum RPS achieved: {{ max_rps }}"
      - "Planned load tests: {{ baseline_load_percentages | join('%, ') }}%"
      - "{{ planned_rates | map(attribute='percent') | zip(planned_rates | map(attribute='rate')) | map('join', '% = ') | map('regex_replace', '^(.*)$', '  \\1 req/s') | list }}"

- name: "Baseline Test - Run at each load percentage"
  ansible.builtin.command:
    cmd: >
      {{ vllm_bench_prefix }}
      --host {{ bench_config.vllm_host }}
      --port {{ bench_config.vllm_port }}
      --backend openai-embeddings
      --model "{{ model_name }}"
      --dataset-name random
      --random-input-len {{ embedding_random_input_len | default(512) }}
      --num-prompts {{ num_prompts }}
      --request-rate {{ ((max_rps | float) * (item | float / 100)) | round(2) }}
      --endpoint /v1/embeddings
      --save-result
      --result-filename "{{ results_base_dir }}/baseline/sweep-{{ item }}pct.json"
  loop: "{{ baseline_load_percentages }}"
  register: baseline_load_tests
  changed_when: true

- name: Display baseline test completion
  ansible.builtin.debug:
    msg: "Baseline sweep tests completed. Results saved to {{ results_base_dir }}/baseline/"
