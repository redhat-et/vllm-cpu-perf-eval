---
# Baseline performance test tasks (sweep test)
# Included by run-embedding-tests.yml

- name: Detect architecture and set defaults
  ansible.builtin.include_role:
    name: common
    tasks_from: detect-architecture

- name: Set vllm-bench execution mode
  ansible.builtin.set_fact:
    use_vllm_bench_container: "{{ benchmark_tool.vllm_bench.use_container | default(true) | bool }}"
    vllm_bench_image: "{{ benchmark_tool.vllm_bench.container_image | default(vllm_server_image_default) }}"
    num_prompts: "{{ benchmark_tool.vllm_bench.num_prompts | default(250) }}"

- name: Build vllm-bench command prefix
  ansible.builtin.set_fact:
    vllm_bench_prefix: >-
      {% if use_vllm_bench_container %}
      podman run --rm --entrypoint="" --network host
      -v {{ bench_config.results_dir }}:{{ bench_config.results_dir }}:z
      {{ vllm_bench_image }}
      /opt/venv/bin/vllm bench serve
      {% else %}
      vllm bench serve
      {% endif %}

- name: Ensure baseline result directory exists
  ansible.builtin.file:
    path: "{{ results_base_dir }}/baseline"
    state: directory
    mode: "0755"

- name: "Baseline Test - Find Maximum Throughput (inf rate)"
  ansible.builtin.command:
    cmd: >
      {{ vllm_bench_prefix }}
      --host {{ bench_config.vllm_host }}
      --port {{ bench_config.vllm_port }}
      --backend openai-embeddings
      --model {{ model_name }}
      --dataset-name random
      --random-input-len {{ embedding_random_input_len | default(512) }}
      --num-prompts {{ num_prompts }}
      --request-rate inf
      --endpoint /v1/embeddings
      --save-result
      --result-filename {{ results_base_dir }}/baseline/sweep-inf.json
  register: baseline_inf_result
  changed_when: true

- name: Set baseline_inf output
  ansible.builtin.set_fact:
    baseline_inf_output: "{{ baseline_inf_result.stdout }}"

- name: Validate baseline test output
  ansible.builtin.assert:
    that:
      - baseline_inf_output is defined
      - baseline_inf_output | length > 0
      - baseline_inf_output is search('Request throughput \(req/s\)')
    fail_msg: |
      Failed to validate vllm bench output. Expected format with 'Request throughput (req/s)' metric.
      Output received: {{ baseline_inf_output | default('No output') }}
    success_msg: "Baseline test output validated"

- name: Parse maximum RPS from inf rate test
  ansible.builtin.set_fact:
    max_rps_match: "{{ baseline_inf_output | regex_search('Request throughput \\(req/s\\):\\s+([0-9.]+)', '\\1') }}"

- name: Validate RPS extraction
  ansible.builtin.assert:
    that:
      - max_rps_match is defined
      - max_rps_match | length > 0
      - max_rps_match[0] is defined
    fail_msg: |
      Failed to extract RPS value from output.
      Pattern: 'Request throughput (req/s): <number>'
      Output: {{ baseline_inf_output }}
    success_msg: "RPS value extracted successfully"

- name: Convert RPS to float
  ansible.builtin.set_fact:
    max_rps: "{{ max_rps_match[0] | float }}"

- name: Validate RPS value
  ansible.builtin.assert:
    that:
      - max_rps | float > 0
    fail_msg: "Invalid RPS value: {{ max_rps }}. Expected positive number."
    success_msg: "RPS value validated: {{ max_rps }}"

- name: Display maximum RPS
  ansible.builtin.debug:
    msg:
      - "Maximum RPS achieved: {{ max_rps }}"
      - "25% rate: {{ ((max_rps | float) * 0.25) | round(2) }}"
      - "50% rate: {{ ((max_rps | float) * 0.50) | round(2) }}"
      - "75% rate: {{ ((max_rps | float) * 0.75) | round(2) }}"

- name: "Baseline Test - 25% Load"
  ansible.builtin.command:
    cmd: >
      {{ vllm_bench_prefix }}
      --host {{ bench_config.vllm_host }}
      --port {{ bench_config.vllm_port }}
      --backend openai-embeddings
      --model {{ model_name }}
      --dataset-name random
      --random-input-len {{ embedding_random_input_len | default(512) }}
      --num-prompts {{ num_prompts }}
      --request-rate {{ ((max_rps | float) * 0.25) | round(2) }}
      --endpoint /v1/embeddings
      --save-result
      --result-filename {{ results_base_dir }}/baseline/sweep-25pct.json
  changed_when: true

- name: "Baseline Test - 50% Load"
  ansible.builtin.command:
    cmd: >
      {{ vllm_bench_prefix }}
      --host {{ bench_config.vllm_host }}
      --port {{ bench_config.vllm_port }}
      --backend openai-embeddings
      --model {{ model_name }}
      --dataset-name random
      --random-input-len {{ embedding_random_input_len | default(512) }}
      --num-prompts {{ num_prompts }}
      --request-rate {{ ((max_rps | float) * 0.50) | round(2) }}
      --endpoint /v1/embeddings
      --save-result
      --result-filename {{ results_base_dir }}/baseline/sweep-50pct.json
  changed_when: true

- name: "Baseline Test - 75% Load"
  ansible.builtin.command:
    cmd: >
      {{ vllm_bench_prefix }}
      --host {{ bench_config.vllm_host }}
      --port {{ bench_config.vllm_port }}
      --backend openai-embeddings
      --model {{ model_name }}
      --dataset-name random
      --random-input-len {{ embedding_random_input_len | default(512) }}
      --num-prompts {{ num_prompts }}
      --request-rate {{ ((max_rps | float) * 0.75) | round(2) }}
      --endpoint /v1/embeddings
      --save-result
      --result-filename {{ results_base_dir }}/baseline/sweep-75pct.json
  changed_when: true

- name: Display baseline test completion
  ansible.builtin.debug:
    msg: "Baseline sweep tests completed. Results saved to {{ results_base_dir }}/baseline/"
