---
# Operating-point tests
# Runs three fixed concurrency probes to characterise latency and throughput
# at representative load levels:
#   conc=1  — sequential (minimum latency, zero queuing)
#   conc=8  — light load (interactive workload)
#   conc=N  — peak throughput (cal_peak_concurrency from latency sweep, or default 32)

- name: Detect architecture and set defaults
  ansible.builtin.include_role:
    name: common
    tasks_from: detect-architecture

- name: Set vllm-bench execution mode
  ansible.builtin.set_fact:
    use_vllm_bench_container: "{{ benchmark_tool.vllm_bench.use_container | default(true) | bool }}"
    vllm_bench_image: "{{ benchmark_tool.vllm_bench.container_image | default(vllm_server_image_default) }}"
    num_prompts: "{{ num_prompts | default(benchmark_tool.vllm_bench.num_prompts | default(1000)) }}"
    vllm_bench_cpuset_cpus: "{{ vllm_bench_cpus | default(benchmark_tool.vllm_bench.cpuset_cpus | default('')) }}"
    vllm_bench_cpuset_mems: "{{ vllm_bench_numa_node | default(benchmark_tool.vllm_bench.cpuset_mems | default('')) }}"
    vllm_bench_max_seconds: "{{ guidellm_max_seconds | default(300) | int }}"

- name: Validate NUMA pinning configuration
  ansible.builtin.assert:
    that:
      - vllm_bench_cpuset_cpus is match('^[0-9,\\-]*$')
      - vllm_bench_cpuset_mems is match('^[0-9,\\-]*$')
    fail_msg: |
      Invalid CPU/NUMA format.
      vllm_bench_cpuset_cpus must match format: '0-15,32-47' or '0,1,2,3'
      vllm_bench_cpuset_mems must match format: '0' or '0,1'
      Current values:
        cpuset_cpus: {{ vllm_bench_cpuset_cpus }}
        cpuset_mems: {{ vllm_bench_cpuset_mems }}
    success_msg: "NUMA pinning configuration validated"
  when: vllm_bench_cpuset_cpus != '' or vllm_bench_cpuset_mems != ''

- name: Get SSH user's home directory
  ansible.builtin.shell: "getent passwd {{ ansible_user }} | cut -d: -f6"
  register: ssh_user_home
  changed_when: false
  become: false

- name: Expand tilde in results directory path
  ansible.builtin.set_fact:
    expanded_results_dir: "{{ bench_config.results_dir | regex_replace('^~', ssh_user_home.stdout) }}"

- name: Build vllm-bench command prefix
  ansible.builtin.set_fact:
    vllm_bench_prefix: >-
      {% if use_vllm_bench_container %}
      podman run --rm --entrypoint="" --network host
      {% if vllm_bench_cpuset_cpus %}--cpuset-cpus {{ vllm_bench_cpuset_cpus }}{% endif %}
      {% if vllm_bench_cpuset_mems %}--cpuset-mems {{ vllm_bench_cpuset_mems }}{% endif %}
      -v "{{ expanded_results_dir }}":"{{ expanded_results_dir }}":z
      {{ vllm_bench_image }}
      /opt/venv/bin/vllm bench serve
      {% else %}
      vllm bench serve
      {% endif %}

- name: Ensure operating_point result directory exists
  ansible.builtin.file:
    path: "{{ results_base_dir }}/operating_point"
    state: directory
    mode: "0755"

- name: Set operating-point concurrency levels
  ansible.builtin.set_fact:
    # sequential (1), light load (8), peak from latency sweep or default 32
    op_concurrency_levels: >-
      {{ ([1, 8] + [cal_peak_concurrency | default(op_peak_concurrency | default(32)) | int]) | unique | list }}

- name: Display operating-point operating points
  ansible.builtin.debug:
    msg:
      - "Operating-point concurrency levels: {{ op_concurrency_levels }}"
      - "  conc=1   → sequential, minimum latency"
      - "  conc=8   → light load"
      - "  conc={{ op_concurrency_levels | last }} → peak throughput{{ ' (from latency sweep)' if cal_peak_concurrency is defined else ' (default)' }}"

# Warmup — only needed when operating_point runs standalone (scenario=operating_point).
# For scenario=all the latency sweep already warmed up the server, and the
# inter-sweep health check in main.yml confirms it is still alive.
- name: "Warmup - Stabilize vLLM batching before operating-point measurement"
  ansible.builtin.command:
    cmd: >
      timeout 120
      {{ vllm_bench_prefix }}
      --host {{ bench_config.vllm_host }}
      --port {{ bench_config.vllm_port }}
      --backend openai-embeddings
      --model "{{ model_name }}"
      --dataset-name random
      --random-input-len {{ embedding_random_input_len | default(512) }}
      --num-prompts 100
      --request-rate inf
      --endpoint /v1/embeddings
  changed_when: false
  ignore_errors: true
  when: scenario == 'operating_point'

- name: Verify embedding endpoint ready before operating-point probes
  ansible.builtin.uri:
    url: "http://{{ bench_config.vllm_host }}:{{ bench_config.vllm_port }}/v1/embeddings"
    method: POST
    body_format: json
    body:
      model: "{{ model_name }}"
      input: "readiness check"
    status_code: 200
  register: op_embedding_ready
  retries: 6
  delay: 10
  until: op_embedding_ready.status == 200
  changed_when: false
  when: scenario == 'operating_point'

- name: "Operating-point Test - Run at each concurrency level"
  ansible.builtin.command:
    cmd: >
      timeout {{ (vllm_bench_max_seconds | int) * 2 }}
      {{ vllm_bench_prefix }}
      --host {{ bench_config.vllm_host }}
      --port {{ bench_config.vllm_port }}
      --backend openai-embeddings
      --model "{{ model_name }}"
      --dataset-name random
      --random-input-len {{ embedding_random_input_len | default(512) }}
      --num-prompts {{ num_prompts }}
      --request-rate inf
      --max-concurrency {{ item }}
      --endpoint /v1/embeddings
      --save-result
      --result-filename "{{ results_base_dir }}/operating_point/conc-{{ item }}.json"
  loop: "{{ op_concurrency_levels }}"
  register: operating_point_tests
  changed_when: true

- name: Display operating-point test completion
  ansible.builtin.debug:
    msg: "Operating-point tests completed. Results saved to {{ results_base_dir }}/operating_point/"
