---
# ==============================================================================
# benchmark_embedding Role - Default Variables
# ==============================================================================
# This file documents the variables used by the benchmark_embedding role.
# All variables are optional and have sensible defaults.

# ==============================================================================
# NUMA Pinning Configuration (Optional)
# ==============================================================================
# These variables control CPU and NUMA node pinning for the benchmark tool
# container (vllm-bench). Pinning can improve performance by reducing memory
# access latency and ensuring consistent benchmark results.
#
# Use cases:
#   - Multi-socket systems: Pin benchmark to same NUMA node as vLLM server
#   - Isolating benchmark load: Pin to specific cores to avoid interference
#   - Performance tuning: Test impact of NUMA placement on throughput/latency
#
# Examples:
#   # Pin to cores 0-15 on NUMA node 0
#   vllm_bench_cpus: "0-15"
#   vllm_bench_numa_node: "0"
#
#   # Pin to specific cores using comma-separated list
#   vllm_bench_cpus: "0,2,4,6,8,10,12,14"
#   vllm_bench_numa_node: "0"
#
#   # Pin to multiple core ranges
#   vllm_bench_cpus: "0-7,16-23"
#   vllm_bench_numa_node: "0,1"
#
# Format:
#   - vllm_bench_cpus: CPU list in format: "0-15" or "0,1,2,3" or "0-7,16-23"
#   - vllm_bench_numa_node: NUMA node in format: "0" or "0,1"
#
# Default: Not set (no pinning, benchmark uses any available CPU)

# vllm_bench_cpus: ""
# vllm_bench_numa_node: ""

# ==============================================================================
# Operating-Point Test Configuration
# ==============================================================================
# Sets the default peak concurrency used when running scenario=operating_point
# standalone (without a prior latency sweep). When scenario=all, the peak is
# derived from the latency sweep results instead.
#
# Default: 32

# op_peak_concurrency: 32

# ==============================================================================
# Workload Shape Configuration
# ==============================================================================
# Defines the named input-length shapes to benchmark. Each shape is a dict
# with a 'name' (used as the result subdirectory) and 'input_len' (tokens).
#
# Three shapes cover the embedding operating envelope:
#   query    (64)   — semantic search queries, classifiers; latency-sensitive
#   chunk   (512)   — RAG document chunks; standard throughput baseline
#   document (1536) — long-form corpus ingestion; tests attention compute limits
#
# To run a single custom shape, override with a one-element list:
#   -e "embedding_workload_shapes=[{'name':'custom','input_len':256}]"

embedding_workload_shapes:
  - name: query
    input_len: 64
  - name: chunk
    input_len: 512
  - name: document
    input_len: 1536

# embedding_peak_shape controls which shape's latency sweep results are used
# to derive cal_peak_concurrency (the operating-point peak probe).
# Default: chunk (the 512-token baseline shape).

# embedding_peak_shape: chunk

# ==============================================================================
# Container Stats Collector Configuration
# ==============================================================================
# Controls polling interval for the background podman stats collector.
# Optional container_stats_cpus (DUT host CPU list) pins the collector via
# taskset so it stays off vLLM server cores.
#
# Default interval: 10 seconds

# container_stats_interval: 10
# container_stats_cpus: ""  # e.g. housekeeping cores on the DUT (not vllm_bench_cpus)
