---
# Post-benchmark helpers for scale-out runs (LLM + embedding).
#
# Required vars:
#   scaleout_results_dir : directory containing test-metadata.json + copied metrics
#
# Optional:
#   scaleout_model_name  : written into test-metadata.json when model_name/model absent

- name: Co-locate benchmarks.json with scale-out metric artifacts (LLM)
  ansible.builtin.shell: |
    set -euo pipefail
    dest="{{ scaleout_results_dir }}"
    [ -d "$dest" ] || exit 0
    if [ -f "$dest/benchmarks.json" ]; then
      echo "benchmarks.json already in $dest"
      exit 0
    fi
    # Search within the run-specific results directory only (scaleout_results_dir
    # is already pinned to this run via test_run_id — no need to climb parents).
    found="$(find "$dest" -maxdepth 3 -name benchmarks.json -type f 2>/dev/null | head -1)"
    if [ -n "$found" ] && [ "$found" != "$dest/benchmarks.json" ]; then
      cp "$found" "$dest/benchmarks.json"
      echo "Copied $found -> $dest/benchmarks.json"
    elif [ -n "$found" ]; then
      echo "benchmarks.json already in $dest"
    else
      echo "No benchmarks.json found in $dest (embedding runs use latency/ instead)"
    fi
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
