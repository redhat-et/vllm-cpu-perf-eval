---
# Backward Compatibility Test
# Verifies that backend abstraction integration doesn't break existing configurations
#
# This test uses actual group_vars configurations to ensure:
# 1. Existing inventory files work unchanged
# 2. vllm_args list format is correctly converted
# 3. All workload types generate valid commands
# 4. Container image selection works as before

- name: Test Backward Compatibility with Existing Configs
  hosts: localhost
  gather_facts: false

  vars_files:
    - inventory/group_vars/all/test-workloads.yml
    - inventory/group_vars/all/infrastructure.yml

  vars:
    # Simulate typical role variables
    test_model: "meta-llama/Llama-3.2-1B"
    vllm_server:
      host: "0.0.0.0"
      port: 8000
    core_configuration:
      tensor_parallel: 1
      cpuset_cpus: "0-7"
      cpuset_mems: "0"
      cores: 8

  tasks:
    - name: Test 1 - Chat workload (most common)
      block:
        - name: Get chat workload config
          ansible.builtin.set_fact:
            workload_cfg: "{{ test_configs.chat }}"
            workload_type: "chat"

        - name: Set vllm_args_merged from workload
          ansible.builtin.set_fact:
            vllm_args_merged: "{{ workload_cfg.vllm_args }}"

        - name: Convert args to dict
          ansible.builtin.include_role:
            name: vllm_server
            tasks_from: convert-args-to-dict

        - name: Generate command using backend abstraction
          ansible.builtin.include_role:
            name: vllm_server
            tasks_from: backend-command
          vars:
            backend_config:
              model: "{{ test_model }}"
              host: "{{ vllm_server.host }}"
              port: "{{ vllm_server.port }}"
              dtype: "{{ vllm_extracted_dtype | default('auto') }}"
              max_tokens: "{{ vllm_extracted_max_len | default(2048) | int }}"
              tensor_parallel: "{{ core_configuration.tensor_parallel }}"
              extra_args: "{{ vllm_extra_args_dict }}"

        - name: Verify chat command
          ansible.builtin.assert:
            that:
              - backend_cmd is defined
              - "'--model' in backend_cmd or 'meta-llama' in backend_cmd"
              - "'--port' in backend_cmd or '8000' in backend_cmd"
              - "'--max-model-len' in backend_cmd or '2048' in backend_cmd"
              - "'--no-enable-prefix-caching' in backend_cmd"
              - "'--block-size' in backend_cmd or '128' in backend_cmd"
            success_msg: "✓ Chat workload command generation works"

    - name: Test 2 - RAG workload (long context)
      block:
        - name: Get RAG workload config
          ansible.builtin.set_fact:
            workload_cfg: "{{ test_configs.rag }}"
            workload_type: "rag"

        - name: Set vllm_args_merged from workload
          ansible.builtin.set_fact:
            vllm_args_merged: "{{ workload_cfg.vllm_args }}"

        - name: Convert args to dict
          ansible.builtin.include_role:
            name: vllm_server
            tasks_from: convert-args-to-dict

        - name: Generate command using backend abstraction
          ansible.builtin.include_role:
            name: vllm_server
            tasks_from: backend-command
          vars:
            backend_config:
              model: "{{ test_model }}"
              host: "{{ vllm_server.host }}"
              port: "{{ vllm_server.port }}"
              dtype: "{{ vllm_extracted_dtype | default('auto') }}"
              max_tokens: "{{ vllm_extracted_max_len | default(8320) | int }}"
              tensor_parallel: "{{ core_configuration.tensor_parallel }}"
              extra_args: "{{ vllm_extra_args_dict }}"

        - name: Verify RAG command
          ansible.builtin.assert:
            that:
              - backend_cmd is defined
              - "'--max-model-len' in backend_cmd"
              - "'8320' in backend_cmd"
            success_msg: "✓ RAG workload command generation works"

    - name: Test 3 - Embedding workload
      block:
        - name: Get embedding workload config
          ansible.builtin.set_fact:
            workload_cfg: "{{ test_configs.embedding }}"
            workload_type: "embedding"

        - name: Set vllm_args_merged from workload
          ansible.builtin.set_fact:
            vllm_args_merged: "{{ workload_cfg.vllm_args }}"

        - name: Convert args to dict
          ansible.builtin.include_role:
            name: vllm_server
            tasks_from: convert-args-to-dict

        - name: Generate command using backend abstraction
          ansible.builtin.include_role:
            name: vllm_server
            tasks_from: backend-command
          vars:
            backend_config:
              model: "RedHatAI/granite-embedding-english-r2"
              host: "{{ vllm_server.host }}"
              port: "{{ vllm_server.port }}"
              dtype: "{{ vllm_extracted_dtype | default('auto') }}"
              max_tokens: "{{ vllm_extracted_max_len | default(512) | int }}"
              tensor_parallel: "{{ core_configuration.tensor_parallel }}"
              extra_args: "{{ vllm_extra_args_dict }}"

        - name: Verify embedding command
          ansible.builtin.assert:
            that:
              - backend_cmd is defined
              - "'granite-embedding' in backend_cmd"
            success_msg: "✓ Embedding workload command generation works"

    - name: Test 4 - Code workload
      block:
        - name: Get code workload config
          ansible.builtin.set_fact:
            workload_cfg: "{{ test_configs.code }}"
            workload_type: "code"
            vllm_args_merged: "{{ test_configs.code.vllm_args }}"

        - name: Convert args to dict
          ansible.builtin.include_role:
            name: vllm_server
            tasks_from: convert-args-to-dict

        - name: Generate command
          ansible.builtin.include_role:
            name: vllm_server
            tasks_from: backend-command
          vars:
            backend_config:
              model: "{{ test_model }}"
              host: "{{ vllm_server.host }}"
              port: "{{ vllm_server.port }}"
              dtype: "{{ vllm_extracted_dtype | default('auto') }}"
              max_tokens: "{{ vllm_extracted_max_len | default(2048) | int }}"
              tensor_parallel: "{{ core_configuration.tensor_parallel }}"
              extra_args: "{{ vllm_extra_args_dict }}"

        - name: Verify code command
          ansible.builtin.assert:
            that:
              - backend_cmd is defined
            success_msg: "✓ Code workload command generation works"

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "Backward Compatibility Test - PASSED"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "✓ All workload types work with backend abstraction"
          - "✓ Existing group_vars configurations unchanged"
          - "✓ vllm_args list format correctly converted"
          - "✓ No breaking changes to inventory structure"
          - ""
          - "Backend abstraction is 100% backward compatible!"
