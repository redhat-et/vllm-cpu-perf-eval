---
# ===========================================================================
# Common: vLLM Embedding Health Check
# ===========================================================================
# This playbook performs health checks on the vLLM embedding server.
# Shared by embedding-benchmark.yml and mteb-benchmark.yml.
#
# Expected variables from calling playbook:
#   - vllm_mode: managed|dut-only|external
#   - vllm_endpoint_url: External endpoint URL (external mode only)
#
# Sets bench_config fact with vllm_host and vllm_port for use by test phases.
# ===========================================================================

- name: "Health Check"
  hosts: localhost
  gather_facts: false
  vars:
    vllm_mode: "{{ hostvars['localhost']['vllm_mode'] }}"
    vllm_endpoint_url: "{{ hostvars['localhost'].get('vllm_endpoint_url', '') }}"

    # Health check configuration
    health_check:
      timeout: 300  # 5 minutes
      interval: 2   # Check every 2 seconds

  tasks:
    - name: Set vLLM host for managed/dut-only mode
      ansible.builtin.set_fact:
        bench_config:
          vllm_host: "{{ hostvars[groups['dut'][0]]['ansible_host'] }}"
          vllm_port: 8000
      when: vllm_mode in ['managed', 'dut-only']

    - name: Parse external endpoint URL
      ansible.builtin.set_fact:
        external_endpoint_parsed: "{{ vllm_endpoint_url | urlsplit }}"
      when: vllm_mode == 'external'

    - name: Set vLLM host for external mode
      ansible.builtin.set_fact:
        bench_config:
          vllm_host: "{{ external_endpoint_parsed.hostname }}"
          vllm_port: "{{ external_endpoint_parsed.port | default(8000, true) | int }}"
      when: vllm_mode == 'external'

    - name: Run vLLM health check
      ansible.builtin.include_role:
        name: common
        tasks_from: vllm-health-check
