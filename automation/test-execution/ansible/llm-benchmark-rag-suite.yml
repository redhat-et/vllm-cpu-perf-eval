    requested_cores: "{{ hostvars['localhost']['effective_core_counts'][1] }}"
  when:
    - hostvars['localhost']['effective_core_counts'] | length > 1
    - not (hostvars['localhost']['rag_skip_scaling'] | bool)
    - "'rag_short' in hostvars['localhost']['eligible_tiers']"

