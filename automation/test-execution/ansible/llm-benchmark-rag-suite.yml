# ==========================================================================
# Suite Summary
# ==========================================================================
- name: "RAG Suite - Summary"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display RAG suite summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "RAG Test Suite - COMPLETE"
          - "============================================================"
          - "Model: {{ test_model | default('external endpoint') }}"
          - "Core Counts Tested: {{ effective_core_counts }}"
          - "Concurrency Levels: {{ rag_concurrency_levels }}"
          - ""
          - "Phases:"
          - "  1. Context Scaling: {{ 'SKIPPED' if rag_skip_scaling else eligible_tiers | join(', ') }}"
          - "  2. Variable Dist:   {{ 'SKIPPED' if (rag_skip_variable or not (can_run_rag_var | bool)) else 'rag_var' }}"
          - "  3. Prefix Caching:  {{ 'SKIPPED' if (rag_skip_caching or not (can_run_rag_var | bool)) else 'rag_var (production)' }}"
          - ""
          - "NOTE: Phase 3 uses synthetic text. Each request gets unique"
          - "tokens so prefix caching has no effect. Results establish a"
          - "structural baseline. Meaningful caching results require"
          - "file-based datasets with shared document prefixes."
          - "============================================================"
