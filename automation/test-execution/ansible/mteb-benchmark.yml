---
# ============================================================================
# MTEB (Massive Text Embedding Benchmark) Quality Testing
# ============================================================================
# This playbook evaluates embedding model quality using the MTEB framework.
# It complements performance benchmarks (throughput/latency) with quality
# metrics (accuracy, retrieval performance, classification scores).
#
# Prerequisites:
#   - vLLM server must be running (managed or external mode)
#   - Model must be loaded and accessible via /v1/embeddings endpoint
#   - MTEB container image available (quay.io or local)
#
# Usage:
#   # Test with managed vLLM (starts vLLM on DUT)
#   ansible-playbook -i inventory/hosts.yml mteb-benchmark.yml \
#     -e "test_model=RedHatAI/granite-embedding-english-r2" \
#     -e "mteb_task_preset=quick"
#
#   # Test with external vLLM endpoint
#   ansible-playbook -i inventory/hosts.yml mteb-benchmark.yml \
#     -e "vllm_mode=external" \
#     -e "vllm_endpoint_url=http://production-vllm:8000" \
#     -e "test_model=RedHatAI/granite-embedding-english-r2" \
#     -e "mteb_task_preset=comprehensive"
#
# ============================================================================

# ===========================================================================
# PHASE 0: Validation and Configuration
# ===========================================================================
- name: "Phase 0 - Validate Configuration"
  hosts: localhost
  gather_facts: true
  vars:
    # Test mode: managed (start vLLM on DUT), external (use existing endpoint)
    vllm_mode: "{{ lookup('env', 'VLLM_MODE') | default('managed', true) }}"

    # Model configuration
    test_model: "{{ lookup('env', 'TEST_MODEL') | default('', true) }}"

    # MTEB configuration
    mteb_task_preset: "{{ lookup('env', 'MTEB_TASK_PRESET') | default('quick', true) }}"
    mteb_tasks: "{{ lookup('env', 'MTEB_TASKS') | default('', true) }}"
    mteb_languages: "{{ lookup('env', 'MTEB_LANGUAGES') | default('eng', true) }}"

    # Container configuration
    mteb_container_image: "{{ lookup('env', 'MTEB_CONTAINER_IMAGE') | default('quay.io/vllm-cpu-perf-eval/vllm-mteb:latest', true) }}"

    # External endpoint (external mode)
    vllm_endpoint_url: "{{ lookup('env', 'VLLM_ENDPOINT_URL') | default('', true) }}"

    # Resource configuration (for managed mode)
    requested_cores: "{{ lookup('env', 'REQUESTED_CORES') | default(16, true) | int }}"

  tasks:
    - name: Set configuration as facts
      ansible.builtin.set_fact:
        vllm_mode: "{{ vllm_mode }}"
        test_model: "{{ test_model }}"
        mteb_task_preset: "{{ mteb_task_preset }}"
        mteb_tasks: "{{ mteb_tasks }}"
        mteb_languages: "{{ mteb_languages }}"
        mteb_container_image: "{{ mteb_container_image }}"
        vllm_endpoint_url: "{{ vllm_endpoint_url }}"
        requested_cores: "{{ requested_cores }}"

    - name: Validate test mode
      ansible.builtin.assert:
        that:
          - vllm_mode in ['managed', 'external']
        fail_msg: "Invalid vllm_mode: {{ vllm_mode }}. Must be 'managed' or 'external'"

    - name: Validate model is specified
      ansible.builtin.assert:
        that:
          - test_model | length > 0
        fail_msg: "test_model must be specified via -e or TEST_MODEL environment variable"

    - name: Validate external endpoint is provided (external mode)
      ansible.builtin.assert:
        that:
          - vllm_endpoint_url | length > 0
        fail_msg: "vllm_endpoint_url must be set when vllm_mode=external"
      when: vllm_mode == 'external'

    - name: Display test configuration
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "MTEB Quality Benchmark Configuration"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "Mode: {{ vllm_mode }}"
          - "Model: {{ test_model }}"
          - "Task Preset: {{ mteb_task_preset }}"
          - "{% if mteb_tasks %}Custom Tasks: {{ mteb_tasks }}{% endif %}"
          - "Languages: {{ mteb_languages }}"
          - "Container: {{ mteb_container_image }}"
          - "{% if vllm_mode == 'managed' %}vLLM Server (DUT): {{ groups['dut'][0] }}{% endif %}"
          - "MTEB Runner (Loadgen): {{ groups['load_generator'][0] }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# ===========================================================================
# PHASE 1-2: Common vLLM Lifecycle (Startup & Health Check)
# ===========================================================================
- name: Import vLLM embedding server startup
  ansible.builtin.import_playbook: common/vllm-embedding-startup.yml

- name: Import vLLM health check
  ansible.builtin.import_playbook: common/vllm-embedding-health-check.yml

# ===========================================================================
# PHASE 3: Run MTEB Benchmark
# ===========================================================================
- name: "Phase 3 - Run MTEB Benchmark"
  hosts: load_generator
  become: true
  gather_facts: true
  vars:
    vllm_mode: "{{ hostvars['localhost']['vllm_mode'] }}"
    test_model: "{{ hostvars['localhost']['test_model'] }}"
    mteb_task_preset: "{{ hostvars['localhost']['mteb_task_preset'] }}"
    mteb_tasks: "{{ hostvars['localhost']['mteb_tasks'] }}"
    mteb_languages: "{{ hostvars['localhost']['mteb_languages'] }}"
    mteb_container_image: "{{ hostvars['localhost']['mteb_container_image'] }}"
    mteb_container_name: "mteb-benchmark"
    results_base_dir: "/tmp/mteb-results"

  tasks:
    - name: Build vLLM endpoint URL (managed mode)
      ansible.builtin.set_fact:
        vllm_endpoint_url: "http://{{ hostvars['vllm-server']['ansible_host'] }}:{{ hostvars['localhost']['bench_config']['vllm_port'] }}"
      when: vllm_mode == 'managed'

    - name: Use external vLLM endpoint (external mode)
      ansible.builtin.set_fact:
        vllm_endpoint_url: "{{ hostvars['localhost']['vllm_endpoint_url'] }}"
      when: vllm_mode == 'external'

    - name: Display endpoint being tested
      ansible.builtin.debug:
        msg: "Testing vLLM endpoint: {{ vllm_endpoint_url }}"

    - name: Create results directory
      ansible.builtin.file:
        path: "{{ results_base_dir }}"
        state: directory
        mode: "0755"

    - name: Build MTEB command
      ansible.builtin.set_fact:
        mteb_command: >-
          python /opt/mteb/scripts/run_mteb_benchmark.py
          --endpoint-url {{ vllm_endpoint_url }}
          --model-name {{ test_model }}
          --task-preset {{ mteb_task_preset }}
          --output-dir /results
          --languages {{ mteb_languages }}
          {% if mteb_tasks %}--tasks {{ mteb_tasks }}{% endif %}

    - name: Display MTEB command
      ansible.builtin.debug:
        msg: "{{ mteb_command }}"

    - name: Determine pull policy
      ansible.builtin.set_fact:
        mteb_pull_policy: "{{ 'never' if mteb_container_image.startswith('localhost/') else 'missing' }}"

    - name: Run MTEB benchmark container
      containers.podman.podman_container:
        name: "{{ mteb_container_name }}"
        image: "{{ mteb_container_image }}"
        pull: "{{ mteb_pull_policy }}"
        state: started
        detach: false  # Wait for completion
        rm: true       # Remove container after completion
        network: host  # Access vLLM server via network
        volumes:
          - "{{ results_base_dir }}:/results:z"
        command: "{{ mteb_command }}"
      register: mteb_result

    - name: Display MTEB results
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "✓ MTEB Benchmark Complete"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "Model: {{ test_model }}"
          - "Results: {{ results_base_dir }}/{{ test_model | replace('/', '__') }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# ===========================================================================
# PHASE 4: Fetch Results to Local Machine
# ===========================================================================
- name: "Phase 4 - Fetch MTEB Results"
  hosts: load_generator
  gather_facts: false
  vars:
    results_base_dir: "/tmp/mteb-results"
    local_results_dir: "{{ playbook_dir }}/../../../results/mteb"

  tasks:
    - name: Ensure local results directory exists
      ansible.builtin.file:
        path: "{{ local_results_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Fetch results to local machine
      ansible.posix.synchronize:
        src: "{{ results_base_dir }}/"
        dest: "{{ local_results_dir }}/"
        mode: pull
        recursive: true

# ===========================================================================
# PHASE 5: Common Cleanup
# ===========================================================================
- name: Import vLLM cleanup
  ansible.builtin.import_playbook: common/vllm-embedding-cleanup.yml
