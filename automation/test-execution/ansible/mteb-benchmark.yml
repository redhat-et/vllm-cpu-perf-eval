        state: started
        detach: false  # Wait for completion
        rm: true       # Remove container after completion
        network: host  # Access vLLM server via network
        volumes:
          - "{{ results_base_dir }}:/results:z"
        command: "{{ mteb_command }}"
      register: mteb_result
      when: vllm_mode in ['managed', 'external']

    - name: Display MTEB results
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "✓ MTEB Benchmark Complete"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "Model: {{ test_model }}"
          - "Results: {{ results_base_dir }}/{{ test_model | replace('/', '__') }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      when: vllm_mode in ['managed', 'external']

# ===========================================================================
# PHASE 4a: Fetch Results to Local Machine (DUT-only mode)
# ===========================================================================
- name: "Phase 4a - Fetch MTEB Results (DUT-only mode)"
  hosts: dut
  gather_facts: false
  vars:
    vllm_mode: "{{ hostvars['localhost']['vllm_mode'] }}"
    results_base_dir: "/tmp/mteb-results"
    local_results_dir: "{{ playbook_dir }}/../../../results/mteb"

  tasks:
    - name: Ensure local results directory exists
      ansible.builtin.file:
        path: "{{ local_results_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      when: vllm_mode == 'dut-only'

    - name: Fetch results to local machine
      ansible.posix.synchronize:
        src: "{{ results_base_dir }}/"
        dest: "{{ local_results_dir }}/"
        mode: pull
        recursive: true
      when: vllm_mode == 'dut-only'

    - name: Reorganize MTEB results (create TaskName/test.json structure)
      ansible.builtin.shell: |
        set -e
        # Find all test run directories
        for run_dir in {{ local_results_dir }}/*/2*; do
          if [ ! -d "$run_dir" ]; then continue; fi

          # Check if nested structure exists
          nested_dir="$run_dir/no_model_name_available/no_revision_available"
          if [ -d "$nested_dir" ]; then
            echo "Reorganizing: $run_dir"

            # Move each JSON file to TaskName/test.json structure
            for json_file in "$nested_dir"/*.json; do
              if [ ! -f "$json_file" ]; then continue; fi

              # Get task name (filename without .json)
              task_name=$(basename "$json_file" .json)

              # Skip metadata files
              if [ "$task_name" = "model_meta" ]; then
                mv "$json_file" "$run_dir/" 2>/dev/null || true
                continue
              fi

              # Create TaskName directory and move to test.json
              mkdir -p "$run_dir/$task_name"
              mv "$json_file" "$run_dir/$task_name/test.json"
            done

            # Remove nested directories
            rm -rf "$run_dir/no_model_name_available"
          fi

          # Also fix files already at root level (from previous reorganization)
          for json_file in "$run_dir"/*.json; do
            if [ ! -f "$json_file" ]; then continue; fi

            # Get task name
            task_name=$(basename "$json_file" .json)

            # Skip summary and metadata files
            if [ "$task_name" = "run_summary" ] || [ "$task_name" = "model_meta" ]; then
              continue
            fi

            # Create TaskName directory and move to test.json
            if [ ! -d "$run_dir/$task_name" ]; then
              echo "Fixing root-level file: $task_name"
              mkdir -p "$run_dir/$task_name"
              mv "$json_file" "$run_dir/$task_name/test.json"
            fi
          done
        done
      delegate_to: localhost
      when: vllm_mode == 'dut-only'

