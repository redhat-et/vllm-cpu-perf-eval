---
# ============================================================================
# Test Workload Configurations
# ============================================================================
# Predefined test configurations for different workload types
# These are model-agnostic and can be used with any compatible model
#
# ============================================================================
# Design Rationale
# ============================================================================
# Core fixed shapes (LLM generative) are aligned with the kubernetes-sigs/
# inference-perf workload catalog but adapted for CPU hardware evaluation:
#
#   chat (512/512)
#     Balanced ISL:OSL — equal prefill and decode pressure. Maps to
#     inference-perf interactive-chat (mean 50/300), scaled up for a fixed-
#     value benchmark that avoids distribution-driven noise.
#
#   summarization (2048/256)
#     Prefill-heavy (8:1 ISL:OSL) — stresses TTFT and AMX compute during
#     dense prompt ingestion. Maps to inference-perf deep-research (mean
#     3000/300); our value is conservative enough to run on 8K-context models.
#
#   reasoning (256/2048)
#     Decode-heavy (1:8 ISL:OSL) — stresses memory bus and autoregressive
#     throughput. Maps to inference-perf reasoning (mean 1000/8000). OSL is
#     capped at 2048 because at ~20 tok/s on CPU, 8000 OSL per request takes
#     ~400s — impractical for a benchmark. 2048 already isolates the decode
#     bottleneck clearly.
#
#   batch_generation (512/4096)
#     Sustained-decode — small input, large uniform output. Maps directly to
#     inference-perf batch-synthetic-data-generation (mean 500/4000). Distinct
#     from reasoning: stresses bulk data throughput and memory bandwidth
#     ceiling, not chain-of-thought latency.
#
# Shapes removed as redundant:
#   chat_lite (128/128)   — covered by chat at lower concurrency
#   code (1024/1024)      — same 1:1 ratio as chat; not a distinct stress axis
#   rag (7680/512)        — extreme prefill; context_scaling_8k covers this territory
#
# Variable variants (*_var) add distribution-based ISL/OSL to capture
# padding-waste, head-of-line-blocking, and batching efficiency effects
# that fixed-value tests miss.
#
# Context-scaling workloads (context_scaling_*) are a dedicated TTFT scaling
# series, not general-purpose shapes — they are kept separate from the core set.
#
# ============================================================================
# Configuration Parameters:
#   workload_type: Descriptive name for the workload
#   isl: Input Sequence Length (tokens)
#   osl: Output Sequence Length (tokens)
#   variability: Whether to use variable sequence lengths (for realistic traffic)
#   backend: GuideLLM backend type (openai-chat, openai-completions, openai-embeddings)
#   vllm_args: Arguments passed to vLLM server (NOTE: --dtype is model-specific and will be overridden)
#   kv_cache_space: KV cache allocation for this workload (NOTE: will be overridden by model-specific value)
#
# Variable Workload Parameters (when variability: true):
#   isl_stdev: Standard deviation for input length
#   isl_min/isl_max: Input length bounds
#   osl_stdev: Standard deviation for output length
#   osl_min/osl_max: Output length bounds
#
# KV Cache Sizing Guidelines:
#   NOTE: The kv_cache_space values below are FALLBACK values only.
#   Model-specific KV cache sizes are defined in models/llm-models/model-matrix.yaml
#   and will override these values during test execution.
#
#   The kv_cache_space is calculated based on:
#   - Total sequence length (isl + osl)
#   - Expected concurrent requests
#   - Model architecture (hidden_size, num_layers, num_kv_heads)
#   - Data type (bfloat16 = 2 bytes per element)
#   - Safety margin for variable workloads
#
#   Formula: 2 × num_hidden_layers × tokens × num_key_value_heads × head_size × dtype_bytes
#   See models/models.md for detailed per-model calculations.

test_configs:
  # ============================================================================
  # Embedding Model Testing
  # ============================================================================
  embedding:
    workload_type: "embedding"
    isl: 512                      # Input sequence length for embeddings
    osl: 1                        # No generation, single token placeholder
    variability: false
    backend: "openai-embeddings"
    vllm_args:
      - "--dtype=auto"            # Fallback dtype - overridden by model-specific dtype
    kv_cache_space: "4GiB"        # Appropriate for 270-311M models at isl=512; override for large context models (e.g., Qwen3-Embedding-8B)

  # ============================================================================
  # LLM Generative Models — Three Core Shapes
  #
  # These cover the three operational extremes for CPU LLM serving:
  #   chat          (512/512)   — balanced: equal prefill and decode pressure
  #   summarization (2048/256)  — prefill-heavy: tests TTFT and compute throughput
  #   reasoning     (256/2048)  — decode-heavy: tests memory bandwidth and sustained generation
  #
  # For context-length scaling tests, see the context_scaling_* entries below.
  # For realistic mixed-traffic tests, see the *_var entries below.
  # ============================================================================

  # Balanced workload — equal prefill and decode pressure
  chat:
    workload_type: "chat"
    isl: 512                            # Standard input: user query
    osl: 512                            # Standard output: assistant response
    variability: false
    backend: "openai-chat"
    vllm_args:
      - "--dtype=auto"                  # Fallback dtype - overridden by model-specific dtype
      - "--no-enable-prefix-caching"    # Baseline mode: no prefix caching
      - "--max-model-len=2048"          # Limit model context to workload needs (2x total tokens for headroom)
      - "--block-size=128"              # CPU optimal: multiples of 32 for SIMD alignment (AVX2/AVX512/NEON)
    kv_cache_space: "40GiB"             # Fallback value - should be overridden by model-specific kv_cache_sizes

  # Prefill-heavy workload — long input, short output; stresses TTFT and AMX compute
  summarization:
    workload_type: "summarization"
    isl: 2048                           # Long input: document to summarize
    osl: 256                            # Short output: summary
    variability: false
    backend: "openai-completions"
    vllm_args:
      - "--dtype=auto"                  # Fallback dtype - overridden by model-specific dtype
      - "--no-enable-prefix-caching"    # Baseline mode: no prefix caching
      - "--max-model-len=4096"          # Limit model context to workload needs (2304 tokens)
      - "--block-size=128"              # CPU optimal: multiples of 32 for SIMD alignment (AVX2/AVX512/NEON)
    kv_cache_space: "40GiB"             # Fallback value - should be overridden by model-specific kv_cache_sizes

  # Decode-heavy workload — short input, long output; stresses memory bus and autoregressive throughput
  reasoning:
    workload_type: "reasoning"
    isl: 256                            # Short input: reasoning prompt
    osl: 2048                           # Long output: chain-of-thought (8000 in inference-perf; 2048 is CPU-appropriate ceiling)
    variability: false
    backend: "openai-completions"
    vllm_args:
      - "--dtype=auto"                  # Fallback dtype - overridden by model-specific dtype
      - "--no-enable-prefix-caching"    # Baseline mode: no prefix caching
      - "--max-model-len=4096"          # Limit model context to workload needs (2304 tokens)
      - "--block-size=128"              # CPU optimal: multiples of 32 for SIMD alignment (AVX2/AVX512/NEON)
    kv_cache_space: "40GiB"             # Fallback value - should be overridden by model-specific kv_cache_sizes

  # Sustained-decode workload — small input, very large uniform output; maps to inference-perf
  # batch-synthetic-data-generation. Distinct from reasoning: stresses bulk data throughput
  # and memory bandwidth ceiling, not chain-of-thought generation latency.
  batch_generation:
    workload_type: "batch_generation"
    isl: 512                            # Short prompt: generation instructions
    osl: 4096                           # Large uniform output: generated dataset entries
    variability: false
    backend: "openai-completions"
    vllm_args:
      - "--dtype=auto"                  # Fallback dtype - overridden by model-specific dtype
      - "--no-enable-prefix-caching"    # Baseline mode: no prefix caching
      - "--max-model-len=8192"          # 512 + 4096 = 4608 + headroom
      - "--block-size=128"              # CPU optimal: multiples of 32 for SIMD alignment (AVX2/AVX512/NEON)
    kv_cache_space: "40GiB"             # Fallback value - should be overridden by model-specific kv_cache_sizes

  # ============================================================================
  # Variable Workloads (Realistic Traffic Simulation)
  # ============================================================================

  # Balanced variable — realistic chat traffic with sequence length variance
  chat_var:
    workload_type: "chat_var"
    isl: 512                            # Mean input length
    isl_stdev: 128                      # Input length std dev (~25% variance)
    isl_min: 128                        # Minimum input (short questions)
    isl_max: 1024                       # Maximum input (detailed queries)
    osl: 512                            # Mean output length
    osl_stdev: 128                      # Output length std dev (~25% variance)
    osl_min: 256                        # Minimum output (brief answers)
    osl_max: 1024                       # Maximum output (detailed responses)
    variability: true                   # Enable statistical distribution
    backend: "openai-chat"
    vllm_args:
      - "--dtype=auto"                  # Fallback dtype - overridden by model-specific dtype
      - "--no-enable-prefix-caching"    # Baseline mode: no prefix caching
      - "--max-model-len=4096"          # Limit model context to workload needs (max 2048 tokens)
      - "--block-size=128"              # CPU optimal: multiples of 32 for SIMD alignment (AVX2/AVX512/NEON)
    kv_cache_space: "40GiB"             # Fallback value - should be overridden by model-specific kv_cache_sizes

  # Prefill-heavy variable — realistic document processing with input length variance
  summarization_var:
    workload_type: "summarization_var"
    isl: 1024                           # Mean input length
    isl_stdev: 256                      # Input length std dev (~25% variance)
    isl_min: 512                        # Minimum input (short articles)
    isl_max: 2048                       # Maximum input (long articles)
    osl: 256                            # Mean output length
    osl_stdev: 64                       # Output length std dev (~25% variance)
    osl_min: 128                        # Minimum output (brief summaries)
    osl_max: 512                        # Maximum output (detailed summaries)
    variability: true                   # Enable statistical distribution
    backend: "openai-completions"
    vllm_args:
      - "--dtype=bfloat16"
      - "--no-enable-prefix-caching"    # Baseline mode: no prefix caching
      - "--block-size=128"              # CPU optimal: multiples of 32 for SIMD alignment (AVX2/AVX512/NEON)
    kv_cache_space: "40GiB"             # ~1280 avg tokens * ~32 concurrent

  # ============================================================================
  # Context-Length Scaling Workloads (IETF Long Context Scaling Test)
  # ============================================================================
  # Fixed 256-token output with increasing input lengths to measure
  # how TTFT and throughput scale with context size.

  context_scaling_1k:
    workload_type: "context_scaling_1k"
    isl: 1024                           # 1K input tokens
    osl: 256                            # Fixed short output
    variability: false
    backend: "openai-completions"
    vllm_args:
      - "--dtype=auto"
      - "--no-enable-prefix-caching"
      - "--max-model-len=2048"
    kv_cache_space: "40GiB"

  context_scaling_4k:
    workload_type: "context_scaling_4k"
    isl: 4096                           # 4K input tokens
    osl: 256                            # Fixed short output
    variability: false
    backend: "openai-completions"
    vllm_args:
      - "--dtype=auto"
      - "--no-enable-prefix-caching"
      - "--max-model-len=8192"
    kv_cache_space: "40GiB"

  context_scaling_8k:
    workload_type: "context_scaling_8k"
    isl: 8192                           # 8K input tokens
    osl: 256                            # Fixed short output
    variability: false
    backend: "openai-completions"
    vllm_args:
      - "--dtype=auto"
      - "--no-enable-prefix-caching"
      - "--max-model-len=16384"
    kv_cache_space: "40GiB"

# ============================================================================
# Prefix Caching Mode Configurations
# ============================================================================
# Used to toggle between baseline (no caching) and production (with caching) testing

caching_modes:
  baseline:
    description: "Baseline performance without caching optimizations"
    vllm_args:
      - "--no-enable-prefix-caching"

  production:
    description: "Production configuration with prefix caching enabled"
    vllm_args:
      - "--enable-prefix-caching"
