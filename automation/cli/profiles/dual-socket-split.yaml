# Example CPU pinning profile: dual-socket split
# Use case: Pin vLLM to socket 1, GuideLLM to socket 0
#
# Assumes a dual-socket system with:
# - Socket 0: cores 0-31, NUMA node 0
# - Socket 1: cores 64-95, NUMA node 1
#
# To customize CPU pinning for your system:
# 1. Copy this file to your own profile (e.g., my-profile.yaml)
# 2. Modify the CPU ranges and NUMA node assignments below
# 3. Use with: --profile path/to/my-profile.yaml
#
# Usage:
#   cpueval --suite concurrent-load \
#     --model meta-llama/Llama-3.2-1B-Instruct \
#     --cores 32 \
#     --profile dual-socket-split

# Pin vLLM to socket 1 (cores 64-95).
# NOTE: vllm_cpus is a *fixed range* — it overrides count-based cpuset allocation.
# --cores only controls the auto-allocation count when vllm_cpus is NOT set.
# With this profile, vLLM always uses all 32 cores in 64-95 regardless of --cores.
vllm_cpus: "64-95"
vllm_numa_node: 1

# Pin GuideLLM to socket 0 (cores 0-31)
guidellm_cpus: "0-31"
guidellm_numa_node: 0
