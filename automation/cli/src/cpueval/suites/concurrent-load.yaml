name: concurrent-load
description: "Upstream LLM concurrent load - full matrix (60 combinations by default: all models × 3 cores × 4 workloads)"
runner: script
target: automation/test-execution/scripts/bash/run-concurrent-load-suite.sh
matrix: true

defaults:
  models: all
  cores: "8,16,32"
  workloads: "chat,code,summarization,rag"
  phase: "1"

param_mappings:
  models: --models
  model: --models
  cores: --cores
  workloads: --workloads
  workload: --workloads
  phase: --phase
  skip_models: --skip-models
  vllm_cpus: vllm-cpus
  vllm_cpu_start: vllm-cpu-start
  vllm_numa_node: vllm-numa-node
  guidellm_cpus: guidellm-cpus
  guidellm_numa_node: guidellm-numa-node
  requested_tensor_parallel: tensor-parallel
  continue_on_error: continue-on-error
