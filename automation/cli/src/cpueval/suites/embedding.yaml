name: embedding
description: >
  Embedding model performance - baseline + latency tests.
  Presets: all (5 RedHatAI models), small, medium, large, quick,
  granite-ml (embeddinggemma-300m, harrier-oss-v1-270m,
  granite-embedding-278m-multilingual, granite-embedding-311m-multilingual-r2).
  For parallel 3-slot execution use run-parallel-embedding.sh directly.
runner: script
target: automation/test-execution/scripts/bash/run-embedding-suite.sh
matrix: true

defaults:
  models: all
  cores: "8,16,32"
  scenario: all
  num_prompts: "1000"

param_mappings:
  models: --models
  model: --models
  cores: --cores
  scenario: --scenario
  num_prompts: --num-prompts
  skip_models: --skip-models
  vllm_bench_cpus: vllm-bench-cpus
  vllm_bench_numa_node: vllm-bench-numa-node
  vllm_cpus: vllm-cpus
  guidellm_max_seconds: max-seconds
  continue_on_error: continue-on-error
  yes: --yes
