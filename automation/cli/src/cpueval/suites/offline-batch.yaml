name: offline-batch
description: Offline batch processing - enterprise workload tiers
runner: script
target: automation/test-execution/scripts/bash/run-offline-batch-suite.sh
matrix: true
args_builder: offline_batch

# Modes: use-cases | use-case-sweep | baseline | batch-scaling | input-scaling |
#        output-scaling | core-scaling | quantization | kv-capacity |
#        context-scaling | all | run_test
#
# Examples:
#   ./cpueval --suite offline-batch
#   ./cpueval --suite offline-batch --mode use-cases --runs 5 --models all
#   ./cpueval --suite offline-batch --mode use-case-sweep \
#     --use-case summarization --models all --cores 8,16,32 --runs 3
#   ./cpueval --suite offline-batch --mode run_test \
#     --model all --dataset random --num-prompts 3 --cores 8 \
#     --input-len 32 --output-len 16
#
# Escape hatch (full positional override):
#   --extra args="use-cases 1 RedHatAI/TinyLlama-1.1B-Chat-v1.0-pruned2.4"

defaults:
  mode: use-cases
  runs: 3

param_mappings: {}
