name: audio
description: Audio model benchmarking (ASR, transcription, translation)
runner: ansible
target: audio-benchmark.yml

defaults:
  test_model: openai/whisper-small
  test_scenario: transcription-throughput
  requested_cores: 32
  vllm_env_vars:
    VLLM_USE_V2_MODEL_RUNNER: "0"

param_mappings:
  model: test_model
  scenario: test_scenario
  cores: requested_cores
