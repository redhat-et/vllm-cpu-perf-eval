---
# Document Summarization Test Scenario
# Measures time to summarize N documents using vLLM offline batch mode

test_scenario:
  name: "document-summarization"
  type: "offline-batch"
  description: "Measure batch summarization performance for different document counts and sizes"

  # Test configuration
  mode: "offline"  # Use vLLM LLM() class, not server
  task: "summarization"

  # Sampling parameters
  sampling:
    temperature: 0.7
    top_p: 0.9
    max_tokens: 256

  # vLLM offline configuration
  llm_config:
    dtype: "bfloat16"
    device: "cpu"
    max_model_len: 4096
    cpu_offload_gb: 0
    trust_remote_code: true
    env_vars:
      VLLM_CPU_KVCACHE_SPACE: "2GiB"

  # Test stages - different batch sizes
  stages:
    - name: "small-batch-10-docs"
      description: "Quick turnaround: 10 short documents"
      num_documents: 10
      document_length: 1000  # tokens per document
      output_length: 256     # summary length
      result_filename: "summarize-10-docs-1k-tokens"

    - name: "small-batch-100-docs"
      description: "Quick turnaround: 100 short documents"
      num_documents: 100
      document_length: 1000
      output_length: 256
      result_filename: "summarize-100-docs-1k-tokens"

    - name: "medium-batch-100-docs"
      description: "Medium documents: 100 docs at 3k tokens"
      num_documents: 100
      document_length: 3000
      output_length: 512
      result_filename: "summarize-100-docs-3k-tokens"

    - name: "large-batch-1000-docs"
      description: "Bulk processing: 1000 short documents"
      num_documents: 1000
      document_length: 1000
      output_length: 256
      result_filename: "summarize-1000-docs-1k-tokens"

    - name: "stress-test-1000-long-docs"
      description: "Stress test: 1000 long documents"
      num_documents: 1000
      document_length: 3000
      output_length: 512
      result_filename: "summarize-1000-docs-3k-tokens"

  # Document generation
  dataset:
    type: "synthetic"  # or "real" for actual document corpus
    synthetic_config:
      source: "random"  # generate random text
      # Alternative: use a seed dataset for more realistic text
      # source: "c4"  # Common Crawl dataset
      # source: "wikipedia"
    real_config:
      # For real document testing
      dataset_name: "cnn_dailymail"
      split: "test"
      text_field: "article"

  # Prompt template for summarization
  prompt_template: |
    Summarize the following document concisely:

    {document}

    Summary:

  # Metrics to collect
  metrics:
    primary:
      - "total_time_sec"
      - "throughput_docs_per_sec"
      - "throughput_tokens_per_sec"
      - "avg_time_per_doc_sec"
    detailed:
      - "prefill_time_sec"
      - "decode_time_sec"
      - "memory_peak_gb"
      - "memory_avg_gb"
      - "cpu_utilization_avg_pct"
      - "cpu_utilization_peak_pct"
    per_request:
      - "input_tokens"
      - "output_tokens"
      - "generation_time_sec"

  # Success criteria
  success_criteria:
    - "All batches complete without OOM"
    - "Throughput scales reasonably with batch size"
    - "No model errors or generation failures"

  # Results output
  results:
    format: "json"
    location: "results/llm/{model}/offline-batch/summarization/"
    include_raw_outputs: false  # Don't save generated summaries by default
    graphs:
      - type: "batch_time_scaling"
        title: "Total Time vs Number of Documents"
        x_axis: "Number of Documents"
        y_axis: "Total Time (seconds)"
      - type: "throughput_scaling"
        title: "Throughput vs Batch Size"
        x_axis: "Number of Documents"
        y_axis: "Documents/Second"
      - type: "memory_usage"
        title: "Memory Usage vs Batch Size"
        x_axis: "Number of Documents"
        y_axis: "Peak Memory (GB)"
