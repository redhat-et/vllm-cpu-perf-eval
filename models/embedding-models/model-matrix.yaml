---
# Model Matrix for Embedding Performance Tests
# Defines which embedding models run which test scenarios

matrix:
  test_suite: "embedding-models"
  description: "Performance evaluation for vLLM embedding models on CPU"
  vllm_version_required: ">=0.11.0"  # Embedding benchmarking support

  # Test case mapping
  test_cases:
    # Test Case 1.1: Baseline Performance - English Model
    - id: "EMB-BASELINE-GRANITE-EN-R2-EMB512"
      description: "Baseline performance and scalability for English embedding model"
      model: "granite-embedding-english-r2"
      model_path: "ibm-granite/granite-embedding-english-r2"
      architecture: "MiniLM/BERT"
      focus: "Enterprise English Embedding Throughput"
      scenarios:
        - operating-point
      quantization: false
      kv_cache: "1GiB"

    # Test Case 1.2: Baseline Performance - Multilingual Model
    - id: "EMB-BASELINE-GRANITE-ML-EMB512"
      description: "Baseline performance and scalability for Multilingual embedding model"
      model: "granite-embedding-278m-multilingual"
      model_path: "ibm-granite/granite-embedding-278m-multilingual"
      architecture: "XLM-RoBERTa"
      focus: "Multilingual Embedding Throughput"
      scenarios:
        - operating-point
      quantization: false
      kv_cache: "1GiB"

    # Test Case 2.1: Latency and Stability - Multilingual Model
    - id: "EMB-LATENCY-GRANITE-ML-EMB512"
      description: "Latency scaling under concurrent load for Multilingual model"
      model: "granite-embedding-278m-multilingual"
      model_path: "ibm-granite/granite-embedding-278m-multilingual"
      architecture: "XLM-RoBERTa"
      focus: "P99 Latency Scaling for Multilingual Encoder"
      scenarios:
        - latency
      quantization: false
      kv_cache: "1GiB"

    # Test Case 3.1: granite-ml parallel benchmark - embeddinggemma-300m
    - id: "EMB-BASELINE-GEMMA-300M-EMB512"
      description: "Baseline performance for embeddinggemma-300m (granite-ml preset, slot 0)"
      model: "embeddinggemma-300m"
      model_path: "RedHatAI/embeddinggemma-300m"
      architecture: "Gemma/Decoder"
      focus: "Decoder-based Dense Embedding Throughput"
      scenarios:
        - operating-point
      quantization: false
      kv_cache: "1GiB"

    # Test Case 3.2: granite-ml parallel benchmark - harrier-oss-v1-270m
    - id: "EMB-BASELINE-HARRIER-270M-EMB512"
      description: "Baseline performance for microsoft/harrier-oss-v1-270m (granite-ml preset, slot 1)"
      model: "harrier-oss-v1-270m"
      model_path: "microsoft/harrier-oss-v1-270m"
      architecture: "Decoder"
      focus: "Microsoft OSS Embedding Throughput"
      scenarios:
        - operating-point
      quantization: false
      kv_cache: "1GiB"
      notes: "Requires --trust-remote-code"

    # Test Case 3.3: granite-ml parallel benchmark - granite-embedding-311m-multilingual-r2
    - id: "EMB-BASELINE-GRANITE-311M-ML-R2-EMB512"
      description: "Baseline performance for granite-embedding-311m-multilingual-r2 (granite-ml preset, slot 2)"
      model: "granite-embedding-311m-multilingual-r2"
      model_path: "ibm-granite/granite-embedding-311m-multilingual-r2"
      architecture: "XLM-RoBERTa"
      focus: "Multilingual Embedding Throughput (r2 release)"
      scenarios:
        - operating-point
      quantization: false
      kv_cache: "1GiB"

  # Embedding model definitions
  embedding_models:
    # English Dense Encoder (MiniLM/BERT family)
    - name: "granite-embedding-english-r2"
      full_name: "ibm-granite/granite-embedding-english-r2"
      gated: false  # Public model (Apache 2.0), no token required
      architecture_family: "MiniLM/BERT"
      application_focus: "Encoder-Only (English Dense)"
      language: "English"
      parameters: "~110M"
      dimensions: 384
      max_sequence_length: 512
      default_scenarios:
        - operating-point

    # Multilingual Dense Encoder (XLM-RoBERTa family)
    - name: "granite-embedding-278m-multilingual"
      full_name: "ibm-granite/granite-embedding-278m-multilingual"
      gated: false  # Public model (Apache 2.0), no token required
      architecture_family: "XLM-RoBERTa"
      application_focus: "Encoder-Only (Multilingual)"
      language: "Multilingual"
      parameters: "278M"
      dimensions: 768
      max_sequence_length: 512
      alternate_models:
        - "granite-embedding-107m-multilingual"
        - "Multilingual-e5-large"
      default_scenarios:
        - operating-point
        - latency

    # Decoder-based Dense Encoder (~300M, Gemma architecture)
    - name: "embeddinggemma-300m"
      full_name: "RedHatAI/embeddinggemma-300m"
      gated: false
      architecture_family: "Gemma/Decoder"
      application_focus: "Decoder-based Dense Embedding"
      language: "Multilingual"
      parameters: "~300M"
      dimensions: 1024
      max_sequence_length: 512
      default_scenarios:
        - operating-point

    # Microsoft OSS Embedding (~270M, Decoder)
    - name: "harrier-oss-v1-270m"
      full_name: "microsoft/harrier-oss-v1-270m"
      gated: false
      architecture_family: "Decoder"
      application_focus: "Microsoft OSS Dense Embedding"
      language: "Multilingual"
      parameters: "~270M"
      dimensions: 1024
      max_sequence_length: 512
      trust_remote_code: true
      default_scenarios:
        - operating-point

    # Granite Multilingual r2 (311M, XLM-RoBERTa family)
    - name: "granite-embedding-311m-multilingual-r2"
      full_name: "ibm-granite/granite-embedding-311m-multilingual-r2"
      gated: false
      architecture_family: "XLM-RoBERTa"
      application_focus: "Encoder-Only (Multilingual, r2)"
      language: "Multilingual"
      parameters: "311M"
      dimensions: 1024
      max_sequence_length: 512
      default_scenarios:
        - operating-point

  # Common test parameters
  common_parameters:
    workload: "Embedding (512:1)"
    input_sequence_length: 512
    output_sequence_length: 1
    affinity: "auto"  # Handled by vLLM automatically
    dtype: "bfloat16"
    kv_cache_space: "1GiB"  # Minimal for embedding models (encoder-only)
    num_prompts: 1000

  # Platform configuration (vendor-specific)
  platform_config:
    cores: "VENDOR-DEFINED"
    numa_nodes: "VENDOR-DEFINED"
    notes: |
      - Core count and NUMA configuration should be optimized per platform
      - Intel Xeon platforms may benefit from specific core binding
      - AMD EPYC platforms may require different NUMA settings

  # Expected test duration (approximate)
  estimated_duration:
    operating_point:
      per_model: "15-25 minutes"
      stages: 3  # conc-1, conc-8, conc-peak
    latency:
      per_model: "40-60 minutes"
      stages: 10  # 16, 24, 32, 48, 64, 96, 128, 192, 256, 384 concurrency

  # Results storage structure
  results_structure: |
    results/embedding/<model-name>/<timestamp>/
    ├── operating_point/
    │   ├── conc-1.json      # sequential probe
    │   ├── conc-8.json      # light-load probe
    │   └── conc-{N}.json    # peak-throughput probe
    ├── latency/
    │   ├── concurrent-16.json
    │   ├── concurrent-24.json
    │   ├── concurrent-32.json
    │   ├── concurrent-48.json
    │   ├── concurrent-64.json
    │   ├── concurrent-96.json
    │   ├── concurrent-128.json
    │   ├── concurrent-192.json
    │   ├── concurrent-256.json
    │   └── concurrent-384.json
    ├── container-stats.jsonl
    └── test-metadata.json
